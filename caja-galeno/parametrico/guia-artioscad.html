<title>Caja tipo Galeno</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Estilo de la casa: tipografías y radios del sistema Cartocor en azul, cuadrícula técnica de 32 px,
   un solo tema claro. Descargas en azul, Reset en naranja, cartón en blanco, variable activa en naranja. */
:root{
  --paper:#fbfbfd;--sheet:#ffffff;--mint:#eef3fa;--soft-bg:#f3f6fa;--tint:#e5edf8;
  --ink:#0b1a2e;--soft:#3a4656;--rule:#cfdbea;--hairline:#d5dfeb;--crease:#6f7f92;--kraft:#ffffff;
  --accent:#1d5fbf;--accent-deep:#174f9f;--eyebrow:#174f9f;--on-accent:#ffffff;--grid:rgba(29,95,191,0.09);
  --blue:#1f78e0;--blue-deep:#1662bd;--on-blue:#ffffff;
  --warn:#a3471f;--note:#3a4656;--orange:#e8630a;--orange-deep:#c25105;--on-orange:#ffffff;--orange-soft:#fdeee3;--orange-ring:rgba(232,99,10,0.18);--field:#ffffff;--flash:#e5edf8;
  --shadow-float:0 10px 30px rgba(29,95,191,0.14);
  --display:Montserrat,Inter,sans-serif;--body:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1480px;margin:0 auto;padding-block:40px 72px;display:grid;gap:22px}
header{display:grid;gap:10px}
.tag{font:500 12px/1.4 var(--mono);color:var(--soft);letter-spacing:.14em;text-transform:uppercase}
header .tag{color:var(--eyebrow);letter-spacing:.16em}
h1{font:700 clamp(34px,5vw,56px)/1.02 var(--display);letter-spacing:-.04em;margin:0;text-wrap:balance}
h1 span{display:block;color:var(--accent)}
h2{font:700 20px/1.15 var(--display);letter-spacing:-.02em;margin:0}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:28px;padding:22px;display:grid;gap:14px;min-width:0;align-content:start}
.sheet.plan-sheet{background-color:var(--mint);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;align-items:baseline}
.desk{display:grid;grid-template-columns:370px minmax(0,1fr);gap:22px;align-items:stretch}
@media (max-width:860px){.desk{grid-template-columns:minmax(0,1fr)}.plan-sheet #plan{height:420px}}
.plan-sheet{grid-template-rows:auto minmax(0,1fr)}
/* El plano ocupa todo el alto que deja el recuadro (que se estira al alto del panel de variables). */
.plan-sheet #plan{display:block;position:relative;min-height:560px;overflow:hidden}
.plan-sheet #plan svg{position:absolute;inset:0}
@media (max-width:860px){.plan-sheet #plan{height:420px;min-height:0}}
form{display:grid;gap:9px}
.var{display:grid;grid-template-columns:30px minmax(0,1fr) 84px;gap:2px 10px;align-items:center}
.var b{font:500 14px var(--mono);color:var(--accent)}
.var label{font-size:14px;color:var(--soft);line-height:1.25}
.var input[type=number]{width:100%;font:500 14px var(--mono);color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:980px;padding:6px 12px;text-align:right;font-variant-numeric:tabular-nums}
.var input[type=range]{grid-column:2 / 4;width:100%;accent-color:var(--accent);margin:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.presets.onda .tag{margin-right:4px}
form{gap:14px}
.grupo{display:grid;gap:9px;background:var(--soft-bg);border:1px solid var(--rule);border-radius:22px;padding:16px 18px 14px}
h3.group{font:700 20px/1.15 var(--display);letter-spacing:-.02em;color:var(--ink);margin:0}
.grupo .presets{margin-top:2px}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--flash);font-weight:600}
button{font:500 14px var(--body);color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:980px;padding:8px 16px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--blue);color:var(--on-blue);border-color:var(--blue);font-weight:600;box-shadow:var(--shadow-float)}
button.primary:hover{background:var(--blue-deep);border-color:var(--blue-deep)}
button.primary:disabled{opacity:.5;cursor:default}
button.reset{justify-self:start;background:var(--orange);color:var(--on-orange);border-color:var(--orange);font-weight:600;padding:7px 22px}
button.reset:hover{background:var(--orange-deep);border-color:var(--orange-deep)}

.right{display:grid;grid-template-rows:1fr auto;gap:22px;min-width:0}
.facts{margin:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:1200px){.facts{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.facts .row{display:grid;align-content:start;gap:6px;padding:14px 13px;background:var(--soft-bg);border:1px solid var(--rule);border-radius:22px;min-width:0}
.facts dt{font:500 10.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--eyebrow)}
.facts dd{margin:0;display:grid;gap:3px}
.facts dd strong{font:700 16px/1.2 var(--display);white-space:nowrap;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.facts dd span{font:500 12px/1.3 var(--body);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-sheet{position:relative}
.descargas{position:absolute;right:22px;bottom:22px;display:flex;align-items:center;gap:8px;max-width:calc(100% - 44px)}
.descargas .status{font-size:12px;text-align:right;max-width:280px;margin-right:4px}
.status{font:13px var(--mono);color:var(--soft);min-height:1.4em;margin:0}

svg.plan{display:block;width:100%;height:100%}
.plan .k{fill:var(--kraft);stroke:var(--kraft);stroke-width:.8;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.plan .c{fill:none;stroke:var(--ink);stroke-width:1.1;vector-effect:non-scaling-stroke}
.plan .h{fill:none;stroke:var(--crease);stroke-width:.9;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.plan .p{fill:none;stroke:var(--crease);stroke-width:.9;stroke-dasharray:2 3;vector-effect:non-scaling-stroke}
.dim path{fill:none;stroke:var(--accent);stroke-width:.6;vector-effect:non-scaling-stroke}
.dim .ar{fill:var(--accent);stroke:none}
.dim text{font:500 17px var(--mono);text-anchor:middle}
.dim text.side{text-anchor:start;font-size:15px}
.dim text.side-l,.dim text.down{text-anchor:end;font-size:15px}
.plan.simple .dim text{font-size:22px}
.plan.simple .call{font-size:18px;fill:var(--accent);font-weight:600}
.head h2{margin-right:auto}
.head h2 .unit{font:500 13px var(--mono);color:var(--soft);letter-spacing:.08em;text-transform:uppercase;margin-left:6px}
.var,.var b,.var label,.var input[type=number],.var input[type=range]{transition:background-color 1.5s ease,color 1.5s ease,border-color 1.5s ease,box-shadow 1.5s ease,accent-color 1.5s ease}
.var.active,.var.active b,.var.active label,.var.active input{transition:none}
.var{border-radius:16px;margin:0 -8px;padding:4px 8px}
#plan .dim path,#plan .dim .ar,#plan .dim text,#plan .dim tspan,#plan .call{transition:stroke 1.5s ease,stroke-width 1.5s ease,fill 1.5s ease,font-size 1.5s ease}
#plan .active path,#plan .active .ar,#plan .active text,#plan .active tspan,#plan .call.active{transition:none}
@media (prefers-reduced-motion:reduce){.var,.var *,#plan *{transition:none!important}}
.var.active{background:var(--orange-soft)}
.var.active b,.var.active label{color:var(--orange-deep);font-weight:600}
.var.active input[type=number]{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-ring)}
.var.active input[type=range]{accent-color:var(--orange)}
.dim.active path{stroke:var(--orange);stroke-width:3.2}
.dim.active .ar{fill:var(--orange)}
.dim.active text .fx,.dim.active text .val{fill:var(--orange-deep);font-weight:700}
.dim.active text,.call.active{paint-order:stroke;stroke:var(--sheet);stroke-width:5px;stroke-linejoin:round}
.dim.active text{font-size:20px}
.plan.simple .dim.active text{font-size:28px}
.call.active{fill:var(--orange-deep);font-weight:700;font-size:22px}
.dim .fx{fill:var(--accent);font-weight:600}.dim .val{fill:var(--soft)}
.dim.hot .val{fill:var(--accent);font-weight:600}
.call{font:500 14px var(--mono);fill:var(--soft);text-anchor:middle}
.figura{margin:2px 0 4px;position:relative}
.campo{position:absolute;transform:translate(-50%,-50%);display:block}
.campo .paso{display:inline-flex;align-items:center;gap:2px;background:var(--field);border:1px solid var(--rule);border-radius:980px;padding:2px 4px 2px 10px;box-shadow:0 1px 3px rgba(11,26,46,.08);transition:border-color 1.5s ease,box-shadow 1.5s ease}
.campo input[type=number]{width:38px;font:600 13px var(--mono);color:var(--ink);background:none;border:0;padding:3px 0;text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield;transition:color 1.5s ease}
.campo input[type=number]:focus-visible{outline:none}
.campo input::-webkit-outer-spin-button,.campo input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.campo .flechas{display:grid}
.campo .flechas button{display:grid;place-items:center;width:18px;height:11px;padding:0;border:0;border-radius:4px;background:none;color:var(--accent);cursor:pointer}
.campo .flechas button:hover{background:var(--flash)}
.campo .flechas svg{width:9px;height:6px;fill:currentColor}
.campo:focus-within .paso{outline:2px solid var(--accent);outline-offset:1px}
.campo.active .paso{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-ring);transition:none}
.campo.active input[type=number]{color:var(--orange-deep);transition:none}
.campo.active .flechas button{color:var(--orange-deep)}
.figura svg{display:block;width:100%;height:auto;overflow:visible}
.figura .tx{font:500 10.5px var(--mono);fill:var(--soft)}
.figura .cota path{fill:none;stroke:var(--accent);stroke-width:.8}
.figura .cota .ar{fill:var(--accent);stroke:none}
.figura .cota text{font:600 10.5px var(--mono);fill:var(--accent)}
.figura [data-var] path,.figura [data-var] text{transition:stroke 1.5s ease,fill 1.5s ease,stroke-width 1.5s ease}
.figura [data-var].active path,.figura [data-var].active text{transition:none}
.figura .cota.active path{stroke:var(--orange);stroke-width:1.6}
.figura .cota.active .ar,.figura .cota.active text{fill:var(--orange-deep)}
@media (prefers-reduced-motion:reduce){.figura *{transition:none!important}}

.figura .pieza{fill:var(--sheet);stroke:var(--ink);stroke-width:1.1;stroke-linejoin:round}
.figura .pieza.lado{fill:var(--soft-bg)}
.figura .pieza.frente{fill:#f8fafc}
.figura .filete{fill:none;stroke:var(--ink);stroke-width:.8}
.figura .cota .fx{fill:var(--accent);font-weight:600}
.figura .cota .val{fill:var(--soft);font-weight:500}
.figura .rotulo{font:500 10.5px var(--mono);fill:var(--soft);transition:fill 1.5s ease}
.figura .rotulo.active{fill:var(--orange-deep);font-weight:700;transition:none}
.figura .cota.active .fx,.figura .cota.active .val{fill:var(--orange-deep);font-weight:700}
.figura .carton .sup{fill:var(--sheet)}
.figura .carton .lado{fill:var(--soft-bg)}
.figura .carton .corte{fill:var(--tint)}
.figura .carton .canal{fill:none;stroke:var(--rule);stroke-width:.8}
.figura .carton .liner{fill:none;stroke:var(--soft);stroke-width:.7}
.figura .carton .onda{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-linejoin:round}
.figura .carton .borde{fill:none;stroke:var(--ink);stroke-width:1;stroke-linejoin:round}
.figura .carton.active .onda{stroke:var(--orange)}

</style>
<main>
  <header>
    <span class="tag">Troquel paramétrico para ArtiosCAD</span>
    <h1>Caja tipo Galeno</h1>
  </header>

  <div class="desk">
    <section class="sheet side" aria-label="Variables">
      <form id="form" autocomplete="off"></form>
      <div class="presets onda" id="atajos" role="group"></div>
      <button type="button" class="reset" id="reset">Reset</button>
    </section>
    <div class="right">
    <section class="sheet plan-sheet" aria-labelledby="t-plano">
      <div class="head"><h2 id="t-plano">Plano <span class="unit">mm</span></h2><button type="button" id="formulas" aria-pressed="false">Ver fórmulas</button></div>
      <div id="plan"></div>
      <div class="descargas">
        <p class="status" id="status" role="status"></p>
        <button type="button" class="primary" id="dl-dxf">Descargar DXF</button>
        <button type="button" class="primary" id="dl-cf2">Descargar CF2</button>
      </div>
    </section>
    <section class="sheet summary" aria-labelledby="t-res">
      <div class="head"><h2 id="t-res">Resumen</h2><span class="tag">mm</span></div>
      <dl class="facts" id="facts"></dl>
    </section>
    </div>
  </div>

</main>
<script>
// Salidas para ArtiosCAD, comunes a todos los diseños: DXF R12 por capas y CF2.
// Un modelo trae entities: { t: "L", k, a, b } o { t: "A", k, c, r, a0, a1 } (grados, antihorario),
// con k = "c" corte, "h" hendido, "p" perforado; y dims: { dir, x0, x1, y0, y1, at, value }.
// La página copia este archivo tal cual: los nombres no pueden chocar con los de un diseño.

const CAPAS_CAD = { c: ["CORTE", 1], h: ["HENDIDO", 2], p: ["PERFORADO", 6] };
const mmEntero = (v) => String(Math.round(v));

// cotas: lista de cotas a dibujar en la capa COTAS (color 7, blanco); rotulo(d) da el texto ("H=274").
function escribirDxf(model, { cotas = [], rotulo = (d) => mmEntero(d.value) } = {}) {
  const out = [];
  const put = (c, v) => out.push(String(c).padStart(3), String(v));
  const f = (v) => (Math.round(v * 1e4) / 1e4).toString();
  put(0, "SECTION"); put(2, "HEADER"); put(9, "$ACADVER"); put(1, "AC1009"); put(9, "$INSUNITS"); put(70, 4); put(9, "$MEASUREMENT"); put(70, 1); put(0, "ENDSEC");
  put(0, "SECTION"); put(2, "TABLES"); put(0, "TABLE"); put(2, "LAYER"); put(70, 4);
  for (const [n, c] of [...Object.values(CAPAS_CAD), ["COTAS", 7]]) { put(0, "LAYER"); put(2, n); put(70, 0); put(62, c); put(6, "CONTINUOUS"); }
  put(0, "ENDTAB"); put(0, "ENDSEC");
  put(0, "SECTION"); put(2, "ENTITIES");
  for (const e of model.entities) {
    const [layer, color] = CAPAS_CAD[e.k];
    if (e.t === "L") { put(0, "LINE"); put(8, layer); put(62, color); put(10, f(e.a[0])); put(20, f(e.a[1])); put(30, 0); put(11, f(e.b[0])); put(21, f(e.b[1])); put(31, 0); }
    else { put(0, "ARC"); put(8, layer); put(62, color); put(10, f(e.c[0])); put(20, f(e.c[1])); put(30, 0); put(40, f(e.r)); put(50, f(((e.a0 % 360) + 360) % 360)); put(51, f(((e.a1 % 360) + 360) % 360)); }
  }
  const line = (a, b) => { put(0, "LINE"); put(8, "COTAS"); put(62, 7); put(10, f(a[0])); put(20, f(a[1])); put(30, 0); put(11, f(b[0])); put(21, f(b[1])); put(31, 0); };
  const text = (at, s, rot) => { put(0, "TEXT"); put(8, "COTAS"); put(62, 7); put(10, f(at[0])); put(20, f(at[1])); put(30, 0); put(40, 10); put(1, s); if (rot) put(50, rot); put(72, 1); put(11, f(at[0])); put(21, f(at[1])); put(31, 0); };
  for (const d of cotas) {
    const v = rotulo(d);
    if (d.dir === "h") { line([d.x0, d.at], [d.x1, d.at]); line([d.x0, d.at - 7], [d.x0, d.at + 7]); line([d.x1, d.at - 7], [d.x1, d.at + 7]); text([(d.x0 + d.x1) / 2, d.at + 5], v); }
    else { line([d.at, d.y0], [d.at, d.y1]); line([d.at - 7, d.y0], [d.at + 7, d.y0]); line([d.at - 7, d.y1], [d.at + 7, d.y1]); text([d.at - 5, (d.y0 + d.y1) / 2], v, 90); }
  }
  put(0, "ENDSEC"); put(0, "EOF");
  return out.join("\r\n") + "\r\n";
}

// CF2 (Common Format 2): formato de intercambio de troquelería que ArtiosCAD importa.
// Tipo de línea: 1 corte, 2 hendido, 3 perforado. Pointage 2 pt. Arcos: dirección 1 antihorario.
function escribirCf2(model, { name = "TROQUEL" } = {}) {
  const b = model.info.bounds;
  const f = (v) => (Math.round(v * 1e3) / 1e3).toFixed(3);
  const type = { c: 1, h: 2, p: 3 };
  const lines = ["$BOF", "V2", "ORDER", `MAIN,${name}`, "END", `MAIN,${name}`, "UM", `LL,${f(b.xMin)},${f(b.yMin)}`, `UR,${f(b.xMax)},${f(b.yMax)}`, "SCALE,1,1"];
  for (const e of model.entities) {
    if (e.t === "L") lines.push(`L,2,${type[e.k]},0,${f(e.a[0])},${f(e.a[1])},${f(e.b[0])},${f(e.b[1])},0,0`);
    else {
      const p = (a) => [e.c[0] + e.r * Math.cos((a * Math.PI) / 180), e.c[1] + e.r * Math.sin((a * Math.PI) / 180)];
      const [s, t] = [p(e.a0), p(e.a1)];
      lines.push(`A,2,${type[e.k]},0,${f(s[0])},${f(s[1])},${f(t[0])},${f(t[1])},${f(e.c[0])},${f(e.c[1])},1,0,0`);
    }
  }
  lines.push("END", "$EOF");
  return lines.join("\r\n") + "\r\n";
}

// Caja envolvente de las entidades (los arcos por puntos).
function limitesDe(entities) {
  const pts = [];
  for (const e of entities) {
    if (e.t === "L") { pts.push(e.a, e.b); continue; }
    let sw = e.a1 - e.a0; while (sw <= 0) sw += 360;
    for (let i = 0; i <= 16; i++) { const a = ((e.a0 + (sw * i) / 16) * Math.PI) / 180; pts.push([e.c[0] + e.r * Math.cos(a), e.c[1] + e.r * Math.sin(a)]); }
  }
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  return { xMin: Math.min(...xs), xMax: Math.max(...xs), yMin: Math.min(...ys), yMax: Math.max(...ys) };
}

// Superficie de cartón del troquel: las caras del grafo plano que tienen algún hendido o intermitente,
// con sus huecos. Es la misma regla que facesOf de ../troquel.mjs, con una grilla para que alcance
// a redibujarse mientras se arrastra un deslizador.

function cartonRings(model) {
  const segs = [];
  for (const e of model.entities) {
    if (e.t === "L") { segs.push([e.a, e.b, e.k]); continue; }
    let sweep = e.a1 - e.a0; while (sweep <= 0) sweep += 360; while (sweep > 360) sweep -= 360;
    const a0 = (e.a0 * Math.PI) / 180, sw = (sweep * Math.PI) / 180;
    const n = Math.max(2, Math.ceil((sw * e.r) / (e.r < 5 ? 0.6 : 4)));
    const at = (i) => [e.c[0] + e.r * Math.cos(a0 + (sw * i) / n), e.c[1] + e.r * Math.sin(a0 + (sw * i) / n)];
    for (let i = 0; i < n; i++) segs.push([at(i), at(i + 1), e.k]);
  }
  const tol = 0.2, cell = 40;
  const key = (x, y) => Math.floor(x / cell) + "," + Math.floor(y / cell);
  // Grilla de segmentos por caja envolvente.
  const grid = new Map();
  segs.forEach((s, i) => {
    const x0 = Math.min(s[0][0], s[1][0]) - tol, x1 = Math.max(s[0][0], s[1][0]) + tol;
    const y0 = Math.min(s[0][1], s[1][1]) - tol, y1 = Math.max(s[0][1], s[1][1]) + tol;
    for (let gx = Math.floor(x0 / cell); gx <= Math.floor(x1 / cell); gx++)
      for (let gy = Math.floor(y0 / cell); gy <= Math.floor(y1 / cell); gy++) {
        const k = gx + "," + gy;
        if (!grid.has(k)) grid.set(k, []);
        grid.get(k).push(i);
      }
  });
  const near = (i) => {
    const s = segs[i], found = new Set();
    const x0 = Math.min(s[0][0], s[1][0]) - tol, x1 = Math.max(s[0][0], s[1][0]) + tol;
    const y0 = Math.min(s[0][1], s[1][1]) - tol, y1 = Math.max(s[0][1], s[1][1]) + tol;
    for (let gx = Math.floor(x0 / cell); gx <= Math.floor(x1 / cell); gx++)
      for (let gy = Math.floor(y0 / cell); gy <= Math.floor(y1 / cell); gy++) for (const j of grid.get(gx + "," + gy) || []) if (j !== i) found.add(j);
    return found;
  };
  // Parte cada segmento donde lo toca otro (uniones en T y cruces).
  const cuts = segs.map(() => [0, 1]);
  segs.forEach((s, i) => {
    const dx = s[1][0] - s[0][0], dy = s[1][1] - s[0][1], len2 = dx * dx + dy * dy;
    for (const j of near(i)) {
      const o = segs[j];
      for (const p of [o[0], o[1]]) {
        const t = ((p[0] - s[0][0]) * dx + (p[1] - s[0][1]) * dy) / len2;
        if (t <= 1e-4 || t >= 1 - 1e-4) continue;
        if (Math.hypot(s[0][0] + dx * t - p[0], s[0][1] + dy * t - p[1]) < tol) cuts[i].push(t);
      }
      const ex = o[1][0] - o[0][0], ey = o[1][1] - o[0][1], den = dx * ey - dy * ex;
      if (Math.abs(den) < 1e-9) continue;
      const wx = o[0][0] - s[0][0], wy = o[0][1] - s[0][1];
      const t = (wx * ey - wy * ex) / den, u = (wx * dy - wy * dx) / den;
      if (t > 1e-4 && t < 1 - 1e-4 && u > 1e-4 && u < 1 - 1e-4) cuts[i].push(t);
    }
  });
  // Vértices soldados con una grilla fina.
  const verts = [], vgrid = new Map();
  const vid = (p) => {
    const gx = Math.floor(p[0] / 1), gy = Math.floor(p[1] / 1);
    for (let a = gx - 1; a <= gx + 1; a++) for (let b = gy - 1; b <= gy + 1; b++)
      for (const k of vgrid.get(a + "," + b) || []) if (Math.hypot(verts[k][0] - p[0], verts[k][1] - p[1]) < tol) return k;
    verts.push(p);
    const k = gx + "," + gy;
    if (!vgrid.has(k)) vgrid.set(k, []);
    vgrid.get(k).push(verts.length - 1);
    return verts.length - 1;
  };
  const edges = new Map();
  segs.forEach((s, i) => {
    const ts = [...new Set(cuts[i].map((t) => Math.round(t * 1e6) / 1e6))].sort((a, b) => a - b);
    const pt = (t) => [s[0][0] + (s[1][0] - s[0][0]) * t, s[0][1] + (s[1][1] - s[0][1]) * t];
    for (let k = 0; k + 1 < ts.length; k++) {
      const u = vid(pt(ts[k])), v = vid(pt(ts[k + 1]));
      if (u === v) continue;
      const id = u < v ? u + "," + v : v + "," + u, prev = edges.get(id);
      if (!prev || prev.k !== "c") edges.set(id, { u, v, k: s[2] });
    }
  });
  // Caras por recorrido de medias aristas.
  const out = verts.map(() => []), half = [];
  [...edges.values()].forEach((e) => {
    for (const [a, b] of [[e.u, e.v], [e.v, e.u]]) {
      const h = { from: a, to: b, e, ang: Math.atan2(verts[b][1] - verts[a][1], verts[b][0] - verts[a][0]) };
      half.push(h);
      out[a].push(h);
    }
  });
  out.forEach((l) => l.sort((p, q) => p.ang - q.ang));
  const seen = new Set(), rings = [];
  for (const h0 of half) {
    if (seen.has(h0)) continue;
    const ring = [];
    let h = h0, material = false;
    while (!seen.has(h)) {
      seen.add(h);
      ring.push(verts[h.from]);
      if (h.e.k !== "c") material = true;
      const list = out[h.to], at = list.findIndex((o) => o.to === h.from && o.e === h.e);
      h = list[(at - 1 + list.length) % list.length];
    }
    let area = 0;
    for (let i = 0; i < ring.length; i++) { const p = ring[i], q = ring[(i + 1) % ring.length]; area += p[0] * q[1] - p[1] * q[0]; }
    // Material: caras con área positiva y algún hendido; las de puro corte son huecos.
    if (area > 0 && material) rings.push(ring);
  }
  return rings;
}

// Caja tipo galeno (troquel 6463) paramétrica.
// generate(params, plantilla) → { entities, dims, info, warnings }
// Unidades: mm. El troquel se arma en las coordenadas del plano original (x a la derecha, y hacia
// arriba); al final la caja se gira 90° a la derecha (tubo vertical) y el separador va a su derecha.
//
// La caja se arma desde la plantilla del troquel 6463 (sus mismas curvas y compensaciones) moviendo
// zonas rectas con L, A y H; las orejas curvas escalan con A. El interior se dibuja desde cero con
// las medidas de las botellas.

// La botella manda: su largo fija el largo de la caja, L = Lb + 3e + 5 (entra en el separador
// plegado, L − 3e, con 5 mm de juego). Con la botella del 6463 (306) y onda B, L = 320.
const BOTTLE_GAP = 5;
const DEFAULTS = {
  Lb: 306, // largo de la botella (va acostada a lo largo de la caja)
  Dc: 80, // ⌀ del cuerpo de la botella: agujero del tabique
  Dn: 31, // ⌀ del cuello de la botella: ranura del tabique
  n: 3, // botellas
  A: 94, // profundidad de la caja (costados)
  H: 274, // alto del frente entre hendidos (largo del tubo)
  t: 28, // puente de los tabiques
  e: 3, // espesor del cartón: onda B (el 6463 está compensado para B)
};
const lengthFor = (Lb, e) => Lb + 3 * e + BOTTLE_GAP;
// El ancho sale de las botellas: n pasos más las paredes y el juego lateral del 6463 (274 = 3 × 86 + 2 × 3 + 10),
// redondeado al milímetro.
const SIDE_GAP = 10;
// La profundidad sale del diámetro de la botella: el agujero en el tabique (A − 2e) con 4 mm por lado
// (94 = 80 + 2 × 3 + 8).
const DEPTH_GAP = 8;
const depthFor = (Dc, e) => Math.round(Dc + 2 * e + DEPTH_GAP);
// Paso mínimo para que los agujeros de ⌀Dc no se toquen.
const pitchMin = (Dc) => Math.ceil(Math.max(Dc + 2, Dc / 2 + FIX.flareW / 2 + 3));
const widthFor = (n, p, e) => Math.round(n * p + 2 * e + SIDE_GAP);
// Paso entre ejes de botellas: el diámetro más 6 mm de tabique entre agujeros (86 con ⌀80; el 6463 tiene 86,25).
const PITCH_GAP = 6;
const pitchFor = (Dc) => Dc + PITCH_GAP;

// Espesores de referencia por onda (mm). Cada fabricante tiene los suyos: e se puede editar.
const ONDAS = { E: 2, B: 3, C: 4 };

const PARAMS = [
  { key: "Lb", group: "Botella", label: "Alto botella", min: 180, max: 350, step: 1 },
  { key: "Dc", group: "Botella", label: "Diámetro botella", min: 36, max: 100, step: 1 },
  { key: "Dn", group: "Botella", label: "Diámetro cuello", min: 8, max: 38, step: 1 },
  { key: "n", group: "Botella", label: "Cantidad", min: 1, max: 6, step: 1 },
  { key: "A", group: "Caja", label: "Alto", min: 60, max: 200, step: 1 },
  { key: "H", group: "Caja", label: "Ancho", min: 120, max: 600, step: 1 },
  { key: "t", group: "Caja", label: "Puente separador", min: 10, max: 80, step: 1 },
  { key: "e", group: "Cartón", label: "Espesor del cartón", min: 1, max: 6, step: 1 },
];
const L_RANGE = [210, 700];

// Medidas fijas del troquel original que no dependen de los parámetros.
const SEPARATOR_GAP = 5;
const FIX = { tongueW: 33, tongueFromCentre: 13, notchW: 25, flareW: 40, flareLen: 23.8, edgeNotchW: 35, edgeNotchD: 4, gap: 8 };

// Medidas del separador. El plegado ocupa siempre L − 3e de largo: si crece el puente t,
// se achica el panel central, así la caja no cambia.
function derived(P) {
  const e = P.e, wall = P.A - 2 * e, folded = P.L - 3 * e, main = folded - 2 * P.t, Wi = P.H - 2 * e;
  return { wall, main, Wi, folded, bottle: folded - BOTTLE_GAP, insertLen: 4 * wall + 2 * P.t + main };
}

// Rango válido de cada variable dado el resto, para que el troquel no tenga líneas cruzadas ni sueltas.
// El orden importa: Dc depende de A y H; Dn de Dc; n y p de Dc y H.
function limits(P) {
  const st = Object.fromEntries(PARAMS.map((q) => [q.key, [q.min, q.max]]));
  const lim = { e: st.e, A: st.A, H: st.H };
  const cl = (v, [a, b]) => Math.min(b, Math.max(a, v));
  const e = cl(P.e, lim.e), A = cl(P.A, lim.A), H = cl(P.H, lim.H);
  // La caja que sale de la botella tiene que quedar entre 210 y 700 de largo.
  lim.Lb = [Math.max(st.Lb[0], L_RANGE[0] - 3 * e - BOTTLE_GAP), Math.min(st.Lb[1], L_RANGE[1] - 3 * e - BOTTLE_GAP)];
  const L = lengthFor(cl(P.Lb, lim.Lb), e);
  // El panel central del separador (L − 3e − 2t) no baja de 40.
  lim.t = [st.t[0], Math.max(st.t[0], Math.min(st.t[1], (L - 3 * e - 40) / 2))];
  lim.Dc = [st.Dc[0], Math.min(st.Dc[1], A - 2 * e - 4, H - 2 * e - 6)];
  const Dc = cl(P.Dc, lim.Dc);
  lim.Dn = [st.Dn[0], Math.min(st.Dn[1], Dc - 6)];
  const room = H - 2 * e - 6 - 2 * Math.max(Dc / 2, FIX.flareW / 2); // de centro a centro de las botellas extremas
  const pMin = Math.max(Dc + 2, Dc / 2 + FIX.flareW / 2 + 3);
  lim.n = [1, Math.max(1, Math.min(st.n[1], 1 + Math.floor(room / pMin + 1e-9)))];
  const n = cl(Math.round(P.n), lim.n);
  lim.p = n > 1 ? [pMin, Math.max(pMin, Math.min(500, room / (n - 1)))] : [pMin, Math.max(pMin, 500)];
  // Todo en milímetros enteros: los rangos se redondean hacia adentro.
  for (const k in lim) { const a = Math.ceil(lim[k][0] - 1e-9), b = Math.floor(lim[k][1] + 1e-9); lim[k] = [a, Math.max(a, b)]; }
  return lim;
}

function clampParams(params) {
  const P = { ...DEFAULTS, ...params };
  // Compatibilidad: si viene L (largo de caja) y no Lb, se deduce la botella.
  if (params && params.L !== undefined && params.Lb === undefined) P.Lb = params.L - 3 * P.e - BOTTLE_GAP;
  // El paso sale del diámetro (salvo que venga dado). Si cambian las botellas y no vienen A o H,
  // la caja las acompaña: el diámetro mueve el alto A; la cantidad y el paso, el ancho H.
  const given = (k) => params && params[k] !== undefined;
  if (!given("p")) P.p = pitchFor(P.Dc);
  if (!given("A") && given("Dc")) P.A = Math.max(60, Math.min(200, depthFor(P.Dc, P.e)));
  if (!given("H") && (given("n") || given("p") || given("Dc"))) P.H = Math.max(120, Math.min(600, widthFor(Math.round(P.n), P.p, P.e)));
  const notes = [];
  const lim = limits(P);
  for (const key of ["e", "Lb", "A", "H", "t", "Dc", "Dn", "n", "p"]) {
    const [a, b] = limits(P)[key];
    let v = key === "n" ? Math.round(P[key]) : P[key];
    if (!Number.isFinite(v)) v = key === "p" ? pitchFor(P.Dc) : DEFAULTS[key];
    const c = Math.min(b, Math.max(a, v));
    if (Math.abs(c - P[key]) > 1e-9) notes.push(`${key} ajustado a ${Math.round(c)} (rango ${a}–${b} con estas medidas).`);
    P[key] = c;
    if (key === "Lb") P.L = lengthFor(P.Lb, P.e);
  }
  return { P, notes, limits: lim };
}

function validate(P) {
  const d = derived(P), w = [];
  const R = P.Dc / 2;
  if (P.Dc > d.wall - 4) w.push(`El agujero de ⌀${P.Dc} no entra en el tabique de ${d.wall} (A − 2e): dejá al menos 2 mm por lado.`);
  if (P.Dn >= P.Dc) w.push(`La ranura del cuello (${P.Dn}) tiene que ser menor que el agujero del cuerpo (${P.Dc}).`);
  if (FIX.flareW <= P.Dn) w.push(`La ranura del cuello (${P.Dn}) es más ancha que la boca de 40 mm de la ranura.`);
  if (R < FIX.tongueW / 2 + 1) w.push(`Con ⌀${P.Dc} la lengüeta de apoyo de 33 mm no cabe en el agujero.`);
  const span = (P.n - 1) * P.p + P.Dc;
  if (span > d.Wi - 6) w.push(`${P.n} botellas con paso ${P.p} ocupan ${Math.round(span)} mm y el interior mide ${Math.round(d.Wi)} (H − 2e).`);
  if (P.n > 1 && P.p < P.Dc + 2) w.push(`El paso (${P.p}) es menor que el agujero más 2 mm: los agujeros se tocan.`);
  if (d.main < 40) w.push(`El panel entre tabiques queda en ${d.main} mm (L − 3e − 2t).`);
  return w;
}

// ---------- Caja: mapa por zonas sobre la plantilla ----------
// Compensaciones de espesor del 6463, que está hecho para onda B (e = 3): corrimiento de los hendidos
// de cierre de cada panel respecto del contrafrente. Con otro espesor se escalan por e / 3.
const PANELS = [
  { name: "costado exterior", to: 161.1, off: 3 },
  { name: "frente", to: 484.1, off: 11 },
  { name: "costado", to: 578.1, off: 4.5 },
  { name: "contrafrente", to: 898.1, off: 0 },
  { name: "solapa de pegado", to: Infinity, off: 7 },
];
const E_B = 3;

// Panel al que pertenece un punto. Junto a un límite entre paneles, el punto es del panel cuyo
// hendido de cierre le queda más cerca: así cada esquina se mueve con su panel.
function panelOf([x, y]) {
  let i = PANELS.findIndex((q) => x < q.to);
  const k = PANELS.findIndex((q) => Math.abs(x - q.to) < 5);
  if (k >= 0 && k < PANELS.length - 1) {
    const creaseY = (j) => (y > 872 ? 1020 - PANELS[j].off : 724 + PANELS[j].off);
    i = Math.abs(y - creaseY(k)) <= Math.abs(y - creaseY(k + 1)) ? k : k + 1;
  }
  return i;
}

function boxMap(P) {
  const dL = P.L - 320, dA = P.A - 94, dH = P.H - 274;
  const de = P.e - E_B, s = P.e / E_B;
  const sA = P.A / 94;
  const base = ([x, y]) => {
    let sx = 0;
    if (x < 531) sx -= dA; // costado
    if (x < 330) sx -= dL + de; // frente: L + e
    if (x < 114) sx -= dA; // costado exterior
    if (x > 640) sx += dL / 2; // contrafrente (dos franjas: la traba queda centrada)
    if (x > 840) sx += dL / 2;
    if (x > 943) sx += dA - de; // solapa de pegado: A − e
    // Hendidos de cierre: el contrafrente mide H + 22e/3 y cada panel se corre off·e/3 hacia adentro.
    const off = PANELS[panelOf([x, y])].off;
    let sy = y > 872 ? dH + 22 * (s - 1) - off * (s - 1) : off * (s - 1);
    if (x >= 165 && x <= 484.1) {
      if (y > 1040) sy += dA - 2 * de; // contratapa: A − 2e
      if (y < 704) sy -= dA - 2 * de;
    } else if (x > 484.1) {
      if (y > 1067) sy += dA; // tapa (A) y guardapolvos
      if (y > 1119 && x > 570 && x < 905) sy += (10 / 3) * de; // pestaña de pared doble: 10e/3
      if (y > 1169) sy += dA - (4 / 3) * de; // lengüeta: A − 4e/3
      if (y < 677) sy -= dA;
      if (y < 625 && x > 570 && x < 905) sy -= (10 / 3) * de;
      if (y < 575) sy -= dA - (4 / 3) * de;
      // Ranura de traba: alto 10e/3, pegada al hendido de la tapa.
      if (x > 690 && x < 795 && y > 1005 && y < 1015) sy -= (10 / 3) * de;
      if (x > 690 && x < 795 && y > 729 && y < 739) sy += (10 / 3) * de;
    }
    return [x + sx, y + sy];
  };
  const ear = ([x, y]) => (x < 165 && (y > 1012 || y < 732) ? (y > 872 ? [161.1, 1017] : [161.1, 727]) : null);
  const map = (p) => {
    const a = ear(p);
    if (!a) return base(p);
    const A2 = base(a);
    return [A2[0] + (p[0] - a[0]) * sA, A2[1] + (p[1] - a[1]) * sA];
  };
  return { map, ear, sA };
}

function box(P, plantilla, out, problems) {
  const { map, ear, sA } = boxMap(P);
  for (const e of plantilla) {
    if (e[0] === "L") {
      out.push({ t: "L", k: e[1], a: map([e[2], e[3]]), b: map([e[4], e[5]]) });
    } else {
      const [, k, cx, cy, r, a0, a1] = e;
      let mid = a0 + (((a1 - a0) % 360) + 360) % 360 / 2;
      const m = [cx + r * Math.cos((mid * Math.PI) / 180), cy + r * Math.sin((mid * Math.PI) / 180)];
      const anchor = ear(m);
      let c, R;
      if (anchor) {
        const A2 = map(anchor);
        c = [A2[0] + (cx - anchor[0]) * sA, A2[1] + (cy - anchor[1]) * sA];
        R = r * sA;
      } else {
        const d = [map(m)[0] - m[0], map(m)[1] - m[1]];
        c = [cx + d[0], cy + d[1]];
        R = r;
      }
      // Los extremos del arco tienen que caer donde caen las líneas vecinas.
      for (const ang of [a0, a1]) {
        const p0 = [cx + r * Math.cos((ang * Math.PI) / 180), cy + r * Math.sin((ang * Math.PI) / 180)];
        const want = map(p0), got = [c[0] + R * Math.cos((ang * Math.PI) / 180), c[1] + R * Math.sin((ang * Math.PI) / 180)];
        const err = Math.hypot(want[0] - got[0], want[1] - got[1]);
        if (err > 0.05) problems.push(`arco en (${cx}, ${cy}) desplazado ${err.toFixed(2)} mm`);
      }
      out.push({ t: "A", k, c, r: R, a0, a1 });
    }
  }
  return map;
}

// ---------- Interior ----------
function insert(P, x0, y0, out) {
  const d = derived(P);
  const { wall, main, Wi } = d;
  const t = P.t;
  const c1 = wall, c2 = wall + t, p1 = 2 * wall + t, p2 = p1 + main, c3 = p2 + wall, c4 = c3 + t, top = c4 + wall;
  const R = P.Dc / 2, hn = P.Dn / 2, hf = FIX.flareW / 2;
  const L = (k, u0, v0, u1, v1) => out.push({ t: "L", k, a: [x0 + u0, y0 + v0], b: [x0 + u1, y0 + v1] });
  const Arc = (k, u, v, r, a0, a1) => out.push({ t: "A", k, c: [x0 + u, y0 + v], r, a0, a1 });
  const deg = (v) => (Math.acos(v) * 180) / Math.PI;
  const centres = Array.from({ length: P.n }, (_, i) => Wi / 2 + (i - (P.n - 1) / 2) * P.p);
  const gaps = { c1: [], c2: [], p1: [], p2: [], c3: [], c4: [], bottom: [], top: [] };

  // Lado A: tabique entre p2 (intermitente) y c3 (hendido); lado B: entre c2 (hendido) y p1 (intermitente).
  const sides = {
    A: { vp: p2, vc: c3, far: c4, s: 1, rowP: "p2", rowC: "c3", rowFar: "c4", edge: "top" },
    B: { vp: p1, vc: c2, far: c1, s: -1, rowP: "p1", rowC: "c2", rowFar: "c1", edge: "bottom" },
  };
  centres.forEach((u, i) => {
    const baseSide = i % 2 === 0 ? "A" : "B";
    const neckSide = baseSide === "A" ? "B" : "A";
    // Agujero del cuerpo con lengüeta de apoyo y muesca al hendido.
    {
      const S = sides[baseSide], vm = (S.vp + S.vc) / 2, ht = FIX.tongueW / 2, hn2 = FIX.notchW / 2;
      const aT = deg(ht / R), aN = deg(hn2 / R);
      if (S.s > 0) { Arc("c", u, vm, R, 360 - aT, aN); Arc("c", u, vm, R, 180 - aN, 180 + aT); }
      else { Arc("c", u, vm, R, 180 - aT, 180 + aN); Arc("c", u, vm, R, 360 - aN, aT); }
      // La lengüeta termina dentro del agujero: 13 antes del centro, o menos si el agujero es chico.
      const vt = vm - S.s * Math.min(FIX.tongueFromCentre, Math.sqrt(R * R - ht * ht) - 3);
      L("c", u - ht, S.vp, u - ht, vt); L("c", u + ht, S.vp, u + ht, vt); L("c", u - ht, vt, u + ht, vt);
      gaps[S.rowP].push([u - ht, u + ht]);
      const vn = vm + S.s * Math.sqrt(R * R - hn2 * hn2);
      L("c", u - hn2, vn, u - hn2, S.vc); L("c", u + hn2, vn, u + hn2, S.vc); L("c", u - hn2, S.vc, u + hn2, S.vc);
      gaps[S.rowC].push([u - hn2, u + hn2]);
      // Muesca en el borde exterior, del lado de la base.
      const hw = FIX.edgeNotchW / 2, dd = FIX.edgeNotchD;
      const ve = S.edge === "top" ? top : 0, vi = S.edge === "top" ? top - dd : dd;
      L("c", u - hw, ve, u - hw, vi); L("c", u - hw, vi, u + hw, vi); L("c", u + hw, vi, u + hw, ve);
      gaps[S.edge].push([u - hw, u + hw]);
    }
    // Ranura del cuello, abierta hacia el puente.
    {
      const S = sides[neckSide], vm = (S.vp + S.vc) / 2, vf = S.vc - S.s * FIX.flareLen;
      if (S.s > 0) Arc("c", u, vm, hn, 180, 360); else Arc("c", u, vm, hn, 0, 180);
      L("c", u - hn, vm, u - hn, vf); L("c", u + hn, vm, u + hn, vf);
      L("c", u - hn, vf, u - hf, S.vc); L("c", u + hn, vf, u + hf, S.vc);
      L("c", u - hf, S.vc, u - hf, S.far); L("c", u + hf, S.vc, u + hf, S.far); L("c", u - hf, S.far, u + hf, S.far);
      gaps[S.rowC].push([u - hf, u + hf]);
      gaps[S.rowFar].push([u - hf, u + hf]);
    }

// Puntos de un arco (extremos y cuadrantes que recorre), para medir la plancha.
function arcPoints(e) {
  let a1 = e.a1;
  while (a1 <= e.a0) a1 += 360;
  const out = [];
  // Extremos exactos: los ángulos cardinales que el arco recorre.
  for (let q = Math.ceil(e.a0 / 90) * 90; q < a1; q += 90) out.push([e.c[0] + e.r * Math.cos((q * Math.PI) / 180), e.c[1] + e.r * Math.sin((q * Math.PI) / 180)]);

  out.push([e.c[0] + e.r * Math.cos((a1 * Math.PI) / 180), e.c[1] + e.r * Math.sin((a1 * Math.PI) / 180)]);
  return out;
}

// ---------- Todo ----------
function generate(params, plantilla) {
  const { P, notes } = clampParams(params);
  const entities = [], problems = [];
  const map = box(P, plantilla, entities, problems);
  const right = map([989.1, 900])[0];
  const bottom = map([700, 525])[1];
  const nBox = entities.length;
  const ins = insert(P, right + FIX.gap, bottom + 31, entities);
  const d = derived(P);
  // Cotas de la caja (en coordenadas del plano original, antes del giro).
  const X = (x) => map([x, 900])[0];
  const Yb = (y) => map([700, y])[1];
  const Yf = (y) => map([300, y])[1];
  const boxDims = [];
  const H_ = (list, x0, x1, at, name) => list.push({ dir: "h", x0, x1, at, name, value: x1 - x0 });

  const cols = [67.1, 161.1, 484.1, 578.1, 898.1, 989.1].map(X);
  const names = ["costado", "frente", "costado", "contrafrente", "pegado"];
  const ptsOf = (list) => list.flatMap((e) => (e.t === "L" ? [e.a, e.b] : arcPoints(e)));
  const yMin0 = Math.min(...ptsOf(entities.slice(0, nBox)).map((q) => q[1]));
  cols.slice(1).forEach((x, i) => H_(boxDims, cols[i], x, yMin0 - 40, names[i]));
  H_(boxDims, cols[0], cols[5], yMin0 - 160, "caja");
  const lidX = (X(586.1) + X(698)) / 2;
  [530, 620, 630, 724, 1020, 1114, 1124, 1214].map(Yb).forEach((y, i, all) => i && V_(boxDims, all[i - 1], y, lidX, ["lengüeta", "pestaña", "tapa", "contrafrente", "tapa", "pestaña", "lengüeta"][i - 1]));
  V_(boxDims, Yf(735), Yf(1009), X(300), "frente");

  // La caja se gira 90° a la derecha: (x, y) → (y, −x). El tubo queda vertical.
  const rot = ([x, y]) => [y, -x];
  for (const e of entities.slice(0, nBox)) {
    if (e.t === "L") { e.a = rot(e.a); e.b = rot(e.b); }
    else { e.c = rot(e.c); e.a0 -= 90; e.a1 -= 90; }
  }
  const dims = boxDims.map((q) => (q.dir === "h"
    ? { dir: "v", src: "h", y0: -q.x1, y1: -q.x0, at: q.at, name: q.name, value: q.value }

  const boxPts = ptsOf(entities.slice(0, nBox));

  // El separador queda a la derecha de la caja con su largo vertical
  // (girado 90° respecto de como quedaba debajo de la caja).
  const r = ins.rows;
  // Pegado a la caja (5 mm de separación de corte) y centrado en su altura.
  const tx = bx.xMax + SEPARATOR_GAP - ins.x0, ty = (bx.yMax + bx.yMin) / 2 - (ins.y0 + r.top / 2);
  const insT = ([x, y]) => [x + tx, y + ty];
  for (const e of entities.slice(nBox)) {
    if (e.t === "L") { e.a = insT(e.a); e.b = insT(e.b); }
    else e.c = insT(e.c);
  }

  H_(dims, ix0, ix1, iy0 - 40, "interior");
  dims[dims.length - 1].src = "h";
  [0, r.c1, r.c2, r.p1, r.p2, r.c3, r.c4, r.top].map((v) => iy0 + v).forEach((y, i, all) => {
    if (!i) return;
    V_(dims, all[i - 1], y, ix1 + 45, ["pared", "puente", "tabique", "panel", "tabique", "puente", "pared"][i - 1]);
    dims[dims.length - 1].src = "v";
  });
  V_(dims, iy0, iy0 + r.top, ix1 + 175, "interior");
  dims[dims.length - 1].src = "v";

  const all = ptsOf(entities);
  const xMin = Math.min(...all.map((q) => q[0])), xMax = Math.max(...all.map((q) => q[0])), yMin = Math.min(...all.map((q) => q[1])), yMax = Math.max(...all.map((q) => q[1]));
  H_(dims, xMin, xMax, yMin - 70, "plano total");
  dims[dims.length - 1].src = "h";
  V_(dims, yMin, yMax, xMin - 210, "plano total");
  dims[dims.length - 1].src = "v";
  const info = {
    caja: `${Math.round(P.L)} × ${Math.round(P.A)} × ${Math.round(P.H)}`,
    // Exterior del tubo armado: dos paredes en largo y profundidad; en alto, el contrafrente entre
    // los hendidos de las tapas (incluye los cierres de pared doble).
    externa: [P.L + 2 * P.e, P.A + 2 * P.e, P.H + (22 / 3) * P.e],
    plancha: `${Math.round(xMax - xMin)} × ${Math.round(yMax - yMin)}`,
    botella: `${Math.round(P.n)} × ${Math.round(P.Lb)} de largo · ⌀ ${Math.round(P.Dc)} cuerpo · ⌀ ${Math.round(P.Dn)} cuello`,
    interior: `${Math.round(d.Wi)} × ${Math.round(d.insertLen)} (plegado ${Math.round(d.folded)} × ${Math.round(d.Wi)} × ${Math.round(d.wall)})`,
    bounds: { xMin, xMax, yMin, yMax },
  };
  ins.T = insT;
  return { P, entities, dims, info, anchors: { map, insert: ins, rot }, notes, warnings: [...validate(P), ...problems] };
}

const r1 = (v) => (Math.round(v * 10) / 10).toString();

// Punta de flecha con la punta en (x, y) y el cuerpo hacia (dx, dy).

  return punta(x0, y0, ux, uy, s) + punta(x1, y1, -ux, -uy, s);

// Texto de una cota como en el plano: la letra de la variable y su valor.

// Botella de vino bordelesa parada, en alzado, dibujada como el troquel: blanca con su contorno. Cuerpo recto

// La forma queda fija (la botella del 6463: 306 × ⌀80, cuello ⌀31); sólo cambian los valores de las cotas.
// Las medidas se escriben en campos sobre las cotas (botellaCampos da dónde va cada uno).

    "Q" + r1(cx + R) + " " + r1(base) + " " + r1(cx + R) + " " + r1(base - heel) + "L" + r1(cx + R) + " " + r1(yb) +
    "C" + r1(cx + R) + " " + r1(k1) + " " + r1(cx + rn) + " " + r1(k2) + " " + r1(cx + rn) + " " + r1(ys) +

    "L" + r1(cx - rr) + " " + r1(top) + "L" + r1(cx - rr) + " " + r1(yr) + "L" + r1(cx - rn) + " " + r1(yr) + "L" + r1(cx - rn) + " " + r1(ys) +

  const nAncho = [-sn, c], nLargo = [sn, c];

// Trozo de cartón corrugado en isométrico: dos papeles lisos y la onda entre ellos, a la vista en el
// corte. La onda crece con el espesor (E 2, B 3, C 4: más alta y más espaciada).
function ondaSvg(P, ondas) {
  const e = P.e, T = 6 + e * 3, pitch = 4 + e * 3, W = 120, D = 36, liner = 1.4, Tmax = 6 + 6 * 3;
  const c = Math.cos(Math.PI / 6), sn = Math.sin(Math.PI / 6);
  // Alto fijo (el del espesor máximo) para que el panel no cambie de tamaño; el trozo apoya abajo.
  const ox = 163 - ((W - D) * c) / 2, oy = 6 + Tmax - T, Hv = Tmax + (W + D) * sn + 30;
  const pt = (x, y, z) => r1(ox + (x - y) * c) + " " + r1(oy + (x + y) * sn - z + T);
  const poly = (ps) => "M" + ps.map((p) => pt(...p)).join("L") + "Z";
  const amp = (T - 2 * liner) / 2 - 0.6, mid = T / 2;
  // Onda en la cara del corte (y = D), de x = 0 a W.
  let onda = "";
  for (let i = 0; i <= 60; i++) { const x = (W * i) / 60; onda += (i ? "L" : "M") + pt(x, D, mid + amp * Math.sin((2 * Math.PI * x) / pitch)); }
  // Líneas de pegado de la onda sobre la cara de arriba, a lo largo de las canaletas.
  let canal = "";
  for (let x = pitch / 4; x < W - 1; x += pitch) canal += "M" + pt(x, 0, T) + "L" + pt(x, D, T);
  const onda0 = Object.keys(ondas).find((k) => ondas[k] === e);
  return '<svg viewBox="0 0 326 ' + r1(Hv) + '" role="img" aria-label="Cartón corrugado ' + (onda0 ? "onda " + onda0 : "") + ", " + e + ' mm">' +
    '<g data-var="e" class="carton">' +
    '<path class="sup" d="' + poly([[0, 0, T], [W, 0, T], [W, D, T], [0, D, T]]) + '"/>' +
    '<path class="canal" d="' + canal + '"/>' +
    '<path class="lado" d="' + poly([[W, 0, 0], [W, D, 0], [W, D, T], [W, 0, T]]) + '"/>' +
    '<path class="corte" d="' + poly([[0, D, 0], [W, D, 0], [W, D, T], [0, D, T]]) + '"/>' +
    '<path class="liner" d="M' + pt(0, D, liner) + "L" + pt(W, D, liner) + "L" + pt(W, 0, liner) + "M" + pt(0, D, T - liner) + "L" + pt(W, D, T - liner) + "L" + pt(W, 0, T - liner) + '"/>' +
    '<path class="onda" d="' + onda + '"/>' +
    '<path class="borde" d="' + poly([[0, 0, T], [W, 0, T], [W, 0, 0], [W, D, 0], [0, D, 0], [0, D, T]]) + "M" + pt(0, D, T) + "L" + pt(W, D, T) + "L" + pt(W, 0, T) + "M" + pt(W, D, T) + "L" + pt(W, D, 0) + '"/>' +
    '<text class="tx" x="163" y="' + r1(Hv - 6) + '" text-anchor="middle">' + (onda0 ? "Onda " + onda0 + " · " : "") + e + " mm</text>" +
    "</g></svg>";
}

function crearDiseno(PLANTILLA) {

  const h = (x, y, dx, dy) => "M" + f1(x) + " " + f1(y) + "L" + f1(x + dx * s - dy * w) + " " + f1(y + dy * s + dx * w) + "L" + f1(x + dx * s + dy * w) + " " + f1(y + dy * s - dx * w) + "Z";
  return h(x0, y0, ux, uy) + h(x1, y1, -ux, -uy);
}
// Letras de variables que aparecen en una fórmula o llamada ("A − 4e/3" → A e).
const LETRAS = new RegExp(DESIGN.letras, "g");
const lettersOf = (txt) => (txt.match(LETRAS) || []).join(" ");
const formulaOf = (d) => (DESIGN.formulas[d.src] && DESIGN.formulas[d.src][d.name]) || null;
let activeVar = null;
function applyActive() {
  form.querySelectorAll("[data-key]").forEach((row) => row.classList.toggle("active", row.dataset.key === activeVar));
  document.querySelectorAll(".figura [data-var]").forEach((el) => el.classList.toggle("active", el.dataset.var === activeVar));
  const want = activeVar ? DESIGN.toca[activeVar] || [] : [];
  document.querySelectorAll("#plan [data-vars]").forEach((el) => {
    const vars = el.dataset.vars ? el.dataset.vars.split(" ") : [];
    el.classList.toggle("active", vars.some((v) => want.includes(v)));
  });
}
let showFormulas = false;
function planSvg(prevDims) {
  const b = model.info.bounds;
  const cx = (b.xMin + b.xMax) / 2;
  // Cotas que se ven: todas con fórmulas; en la vista simple, una por cada clave de DESIGN.simple.
  const seen = new Set();
  const shown = model.dims.map((d, i) => [d, i]).filter(([d]) => {
    if (showFormulas) return true;
    const key = d.src + ":" + d.name;
    if (!(key in DESIGN.simple) || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  // El marco abarca el troquel y las cotas visibles, con aire para los textos.
  let X0 = b.xMin, X1 = b.xMax, Y0 = b.yMin, Y1 = b.yMax;
  for (const [d] of shown) {
    if (d.dir === "h") { X0 = Math.min(X0, d.x0); X1 = Math.max(X1, d.x1); Y0 = Math.min(Y0, d.at); Y1 = Math.max(Y1, d.at); }
    else { X0 = Math.min(X0, d.at); X1 = Math.max(X1, d.at); Y0 = Math.min(Y0, d.y0); Y1 = Math.max(Y1, d.y1); }
  }
  X0 -= 40; X1 += showFormulas ? 120 : 100; Y0 -= 30; Y1 += 20;
  const Y = (y) => Y1 - y;
  const paths = { c: "", h: "", p: "" };
  for (const e of model.entities) {
    if (e.t === "L") paths[e.k] += "M" + f1(e.a[0]) + " " + f1(Y(e.a[1])) + "L" + f1(e.b[0]) + " " + f1(Y(e.b[1]));
    else {
      let sweep = e.a1 - e.a0; while (sweep <= 0) sweep += 360; while (sweep > 360) sweep -= 360;
      const at = (a) => [e.c[0] + e.r * Math.cos(a * Math.PI / 180), e.c[1] + e.r * Math.sin(a * Math.PI / 180)];
      const s = at(e.a0), t = at(e.a1);
      paths[e.k] += "M" + f1(s[0]) + " " + f1(Y(s[1])) + "A" + f1(e.r) + " " + f1(e.r) + " 0 " + (sweep > 180 ? 1 : 0) + " 0 " + f1(t[0]) + " " + f1(Y(t[1]));
    }
  }
  const kraft = cartonRings(model).map((r) => "M" + r.map((p) => f1(p[0]) + " " + f1(Y(p[1]))).join("L") + "Z").join("");
  const text = (d) => {
    const entry = formulaOf(d), v = mm(d.value);
    return entry && entry[0] !== v ? [entry[0] + " = " + v, '<tspan class="fx">' + entry[0] + '</tspan><tspan class="val"> = ' + v + "</tspan>"] : [v, '<tspan class="val">' + v + "</tspan>"];
  };
  const simpleText = (d) => {
    const letter = DESIGN.simple[d.src + ":" + d.name], v = mm(d.value);
    return letter ? [letter + " = " + v, '<tspan class="fx">' + letter + '</tspan><tspan class="val"> = ' + v + "</tspan>"] : [v, '<tspan class="val">' + v + "</tspan>"];
  };
  let dims = "";
  for (const [d, i] of shown) {
    const hot = (prevDims && prevDims[i] !== undefined && Math.abs(prevDims[i] - d.value) > 0.005 ? " hot" : "") + '" data-vars="' + lettersOf(formulaOf(d) ? formulaOf(d)[0] : "");
    const [plain, rich] = showFormulas ? text(d) : simpleText(d);
    const fits = plain.length * 10.4 < Math.abs(d.dir === "h" ? d.x1 - d.x0 : d.y1 - d.y0) - 12;
    if (d.dir === "h") {
      const y = Y(d.at), xm = (d.x0 + d.x1) / 2;
      const base = '<g class="dim' + hot + '"><path d="M' + f1(d.x0) + " " + f1(y - 8) + "V" + f1(y + 8) + "M" + f1(d.x1) + " " + f1(y - 8) + "V" + f1(y + 8) + "M" + f1(d.x0) + " " + f1(y) + "H" + f1(d.x1) + '"/><path class="ar" d="' + arrow(d.x0, y, d.x1, y) + '"/>';
      // Si no entra a lo largo, la etiqueta baja en vertical desde la cota.
      dims += fits
        ? base + '<text x="' + f1(xm) + '" y="' + f1(y - 7) + '">' + rich + "</text></g>"
        : base + '<text class="down" x="' + f1(xm + 5) + '" y="' + f1(y + 12) + '" transform="rotate(-90 ' + f1(xm + 5) + " " + f1(y + 12) + ')">' + rich + "</text></g>";
    } else {
      const x = d.at, ym = Y((d.y0 + d.y1) / 2);
      const base = '<g class="dim' + hot + '"><path d="M' + f1(x - 8) + " " + f1(Y(d.y0)) + "H" + f1(x + 8) + "M" + f1(x - 8) + " " + f1(Y(d.y1)) + "H" + f1(x + 8) + "M" + f1(x) + " " + f1(Y(d.y0)) + "V" + f1(Y(d.y1)) + '"/><path class="ar" d="' + arrow(x, Y(d.y0), x, Y(d.y1)) + '"/>';
      const left = x < cx;
      dims += fits
        ? base + '<text x="' + f1(x - 7) + '" y="' + f1(ym) + '" transform="rotate(-90 ' + f1(x - 7) + " " + f1(ym) + ')">' + rich + "</text></g>"
        : base + '<text class="' + (left ? "side-l" : "side") + '" x="' + f1(left ? x - 10 : x + 10) + '" y="' + f1(ym + 6) + '">' + rich + "</text></g>";
    }
  }
  const calls = (DESIGN.llamadas ? DESIGN.llamadas(model) : []).filter((c) => showFormulas || c[2]);
  const callSvg = calls.map(([p, t]) => '<text class="call" data-vars="' + lettersOf(t) + '" x="' + f1(p[0]) + '" y="' + f1(Y(p[1])) + '">' + t + "</text>").join("");
  return '<svg class="plan' + (showFormulas ? "" : " simple") + '" viewBox="' + f1(X0) + " 0 " + f1(X1 - X0) + " " + f1(Y1 - Y0) + '" role="img" aria-label="' + DESIGN.describir(model) + (showFormulas ? ", con cada cota expresada en sus variables" : ", con las cotas de las variables") + '"><path class="k" d="' + kraft + '"/><path class="c" d="' + paths.c + '"/><path class="h" d="' + paths.h + '"/><path class="p" d="' + paths.p + '"/>' + dims + callSvg + "</svg>";
}
// El deslizador arranca en el medio: la mitad izquierda va del mínimo al valor original y la derecha del
// original al máximo, así llega a los dos extremos aunque el original no esté centrado.
const deBarra = (p, r) => { const d = INICIAL[p.key], v = r < 500 ? p.min + ((d - p.min) * r) / 500 : d + ((p.max - d) * (r - 500)) / 500; return Math.round(v / p.step) * p.step; };
const aBarra = (p, v) => { const d = INICIAL[p.key]; return v <= d ? (d === p.min ? 500 : (500 * (v - p.min)) / (d - p.min)) : (p.max === d ? 500 : 500 + (500 * (v - d)) / (p.max - d)); };
const paramDe = (key) => PARAMETROS.find((q) => q.key === key);
const setValue = (key, v) => { state[key] = v; document.getElementById("v-" + key).value = v; document.getElementById("r-" + key).value = aBarra(paramDe(key), v); };
let hotTimer = 0;
function render(source) {
  for (const p of PARAMETROS) {
    const num = document.getElementById("v-" + p.key), rng = document.getElementById("r-" + p.key);
    if (source === rng) num.value = deBarra(p, Number(rng.value)); else if (source === num) rng.value = aBarra(p, Number(num.value));
    const v = Number(num.value);
    // Todo en milímetros enteros cuando el paso es de 1 o más.
    if (Number.isFinite(v) && v > 0) state[p.key] = Math.min(p.max, Math.max(p.min, p.step >= 1 ? Math.round(v) : v));
  }
  // Variables que siguen a otras (DESIGN.enlazar).
  const key = source && source.id ? source.id.slice(2) : null;
  if (key && DESIGN.enlazar) { const sigue = DESIGN.enlazar(state, key); if (sigue) for (const k in sigue) setValue(k, sigue[k]); }
  const prevDims = model ? model.dims.map((d) => d.value) : null;
  model = DESIGN.generate(state);
  // Rangos que dependen de las otras medidas: el deslizador no deja pasarlos.
  const lim = DESIGN.limits ? DESIGN.limits(model.P) : {};
  for (const p of PARAMETROS) {
    const [a, b2] = lim[p.key] || [p.min, p.max], rng = document.getElementById("r-" + p.key), num = document.getElementById("v-" + p.key);
    num.min = a; num.max = b2;
    rng.value = aBarra(p, model.P[p.key]);
    if (source === "commit" || source === rng) num.value = p.step >= 1 ? Math.round(model.P[p.key]) : model.P[p.key];
  }
  document.getElementById("plan").innerHTML = planSvg(prevDims);
  document.querySelectorAll(".figura").forEach((fig) => {
    fig.querySelector(".lienzo").innerHTML = DESIGN.figuras[fig.dataset.group](model.P);
    // Los campos siguen a sus cotas: posiciones en unidades del viewBox del dibujo.
    if (!DESIGN.campos || !DESIGN.campos[fig.dataset.group]) return;
    const pos = DESIGN.campos[fig.dataset.group](model.P), vb = fig.querySelector("svg").viewBox.baseVal;
    fig.querySelectorAll(".campo").forEach((c) => { const q = pos[c.dataset.key]; c.style.left = (100 * q[0]) / vb.width + "%"; c.style.top = (100 * q[1]) / vb.height + "%"; });
  });
  // La leyenda muestra sólo los tipos de línea que tiene el troquel.
  applyActive();
  if (DESIGN.atajos) document.querySelectorAll("[data-atajo]").forEach((b) => b.setAttribute("aria-pressed", String(Math.abs(Number(b.dataset.atajo) - model.P[DESIGN.atajos.key]) < 1e-9)));
  document.getElementById("facts").innerHTML = DESIGN.resumen(model).map(([k, v, hint]) => '<div class="row"><dt>' + k + "</dt><dd><strong>" + v + "</strong><span>" + hint + "</span></dd></div>").join("");
  clearTimeout(hotTimer);
  hotTimer = setTimeout(() => document.querySelectorAll(".hot").forEach((e) => e.classList.remove("hot")), 1400);
}
const name = () => DESIGN.archivo(model);
const say = (t) => (document.getElementById("status").textContent = t);
// En claude.ai los archivos se guardan con el permiso de descargas (la página protegida lo pide apenas
// carga, en window.__descargas). claude.ai no acepta .dxf ni .cf2: se guardan con .txt al final para
// renombrar. Fuera de claude.ai, o si el permiso no está, descarga directa del navegador.
let downloads = null;
const pedido = window.__descargas || (window.claude && window.claude.use ? window.claude.use("downloads") : null);
if (pedido) pedido.then((d) => { downloads = d; }).catch(() => {});
function directa(text, file) {
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "application/octet-stream" }));
    a.download = file;
    document.body.appendChild(a); a.click(); a.remove();
    say("Descarga iniciada: " + file + ".");
  } catch (e) { say("No se pudo descargar."); }
}
async function download(text, ext) {
  const file = name() + "." + ext;
  if (!downloads && pedido) { say("Preparando la descarga…"); try { downloads = await pedido; } catch (e) {} }
  if (!downloads) { directa(text, file); return; }
  try {
    await downloads.save({ filename: file, data: text });
    say("Guardado " + file + ".");
  } catch (e) {
    if (e && (e.code === "rejected_extension" || e.code === "extension_not_enabled")) {
      try {
        await downloads.save({ filename: file + ".txt", data: text });
        say("Se guardó " + file + ".txt: borrale el .txt del nombre y abrilo en ArtiosCAD.");
      } catch (e2) { say(e2 && e2.code === "declined" ? "Descarga cancelada." : "No se pudo descargar (" + ((e2 && e2.code) || "error") + ")."); }
      return;
    }
    if (e && e.code === "declined") { say("Descarga cancelada."); return; }
    if (e && e.code === "rate_limited") { say("Ya hay una descarga esperando confirmación."); return; }
    directa(text, file);
  }
}
document.getElementById("dl-dxf").addEventListener("click", () => download(DESIGN.dxf(model, name()), "dxf"));
document.getElementById("dl-cf2").addEventListener("click", () => download(DESIGN.cf2(model, name()), "cf2"));
form.addEventListener("input", (e) => render(e.target));
// Flechas de los campos sobre el dibujo: suben o bajan un paso dentro del rango de la variable; lo que
// dependa de otras medidas lo ajusta la página (por ejemplo, el ancho de la caja sigue a la cantidad).
form.addEventListener("click", (e) => {
  const b = e.target.closest("[data-paso]");
  if (!b) return;
  const num = b.closest(".campo").querySelector('input[type="number"]');
  const p = paramDe(b.closest(".campo").dataset.key);
  const v = Math.min(p.max, Math.max(p.min, Number(num.value) + Number(b.dataset.paso) * p.step));
  num.value = v;
  num.dispatchEvent(new Event("input", { bubbles: true }));
  num.dispatchEvent(new Event("change", { bubbles: true }));
});
// Variable activa: mientras se toca o tiene el foco, ella y sus cotas se marcan en naranja.
const setActive = (key) => { if (activeVar !== key) { activeVar = key; applyActive(); } };
// Al soltar (dejar de arrastrar, terminar de escribir o salir del campo) vuelve a la normalidad con
// un fundido de 1,5 s; al tocar de nuevo, el naranja aparece al instante.
let releaseTimer = 0;
const hold = (key) => { clearTimeout(releaseTimer); setActive(key); };
const release = (delay = 0) => { clearTimeout(releaseTimer); releaseTimer = setTimeout(() => setActive(null), delay); };
form.addEventListener("pointerdown", (e) => { const row = e.target.closest("[data-key]"); if (row) hold(row.dataset.key); });
document.addEventListener("pointerup", () => { if (activeVar) release(); });
document.addEventListener("pointercancel", () => { if (activeVar) release(); });
form.addEventListener("keydown", (e) => { const row = e.target.closest("[data-key]"); if (row) hold(row.dataset.key); });
form.addEventListener("keyup", () => release(700));
form.addEventListener("change", () => release());
form.addEventListener("focusout", () => release());
document.getElementById("formulas").addEventListener("click", (e) => {
  showFormulas = !showFormulas;
  e.currentTarget.setAttribute("aria-pressed", String(showFormulas));
  e.currentTarget.textContent = showFormulas ? "Ocultar fórmulas" : "Ver fórmulas";
  document.getElementById("plan").innerHTML = planSvg(null);
  applyActive();
});
form.addEventListener("change", () => render("commit"));
document.querySelectorAll("[data-atajo]").forEach((b) => b.addEventListener("click", () => {
  setValue(DESIGN.atajos.key, Number(b.dataset.atajo));
  render("commit"); say(DESIGN.atajos.titulo + " " + b.dataset.nombre + ": " + b.dataset.atajo + " mm.");
}));
document.getElementById("reset").addEventListener("click", () => {
  for (const k in INICIAL) setValue(k, INICIAL[k]);
  render("commit"); say("");
});
render();
</script>
