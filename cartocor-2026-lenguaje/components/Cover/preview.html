<!-- @dsCard height=300 -->
<div style="position:relative;width:960px;height:300px;background:var(--papel);overflow:hidden;font-family:var(--font-texto)">
  <svg style="position:absolute;inset:0" width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <!-- blocks: corrugado disc r170, flexible pill 240x72, bolsas disc r84, papel-reciclado pill 132x52, arena pill 220x120 (radio-pill = half the short side)
         arrangement: one big disc bleeding off the top, satellites stepping down to the right edge, as the 2025 separators and 2026 photo circles do
         pattern: discs and pills plus one dotted arc — the brand composes with circles, sand blobs and the dotted 2025→2026 arc of its timeline module
         scales: gaps of paso-m (20) and paso-l (32); dots r3 at a 30px pitch; sketch strokes 1.5 in tinta like the TituloPill -->
    <style>.c{fill:var(--corrugado)}.f{fill:var(--flexible)}.b{fill:var(--bolsas)}.p{fill:var(--papel-reciclado)}.a{fill:var(--arena)}.ink{fill:var(--tinta)}.sk{fill:none;stroke:var(--tinta);stroke-width:1.5}</style>
    <rect class="a" x="492" y="150" width="220" height="120" rx="60"/>
    <circle class="c" cx="760" cy="40" r="170"/>
    <rect class="f" x="540" y="196" width="240" height="72" rx="36"/>
    <rect class="sk" x="532" y="190" width="256" height="82" rx="41" transform="rotate(-1.5 660 231)"/>
    <circle class="b" cx="900" cy="250" r="84"/>
    <rect class="p" x="812" y="120" width="132" height="52" rx="26"/>
    <circle class="ink" cx="510" cy="280" r="3"/><circle class="ink" cx="540" cy="251" r="3"/><circle class="ink" cx="570" cy="224" r="3"/><circle class="ink" cx="600" cy="199" r="3"/><circle class="ink" cx="630" cy="178" r="3"/><circle class="ink" cx="660" cy="163" r="3"/><circle class="ink" cx="690" cy="153" r="3"/><circle class="ink" cx="720" cy="150" r="3"/><circle class="ink" cx="750" cy="153" r="3"/><circle class="ink" cx="780" cy="163" r="3"/><circle class="ink" cx="810" cy="178" r="3"/><circle class="ink" cx="840" cy="199" r="3"/><circle class="ink" cx="870" cy="224" r="3"/><circle class="ink" cx="900" cy="251" r="3"/><circle class="ink" cx="930" cy="280" r="3"/>
  </svg>
  <div style="position:absolute;left:40px;bottom:36px;max-width:440px">
    <p style="margin:0;font-family:var(--font-texto);font-weight:700;font-size:88px;line-height:.95;color:var(--tinta)">Cartocor<br>2026</p>
    <p style="margin:12px 0 0;font-size:14px;color:var(--tinta)">Lenguaje de presentaciones: estética 2026, módulos 2025.</p>
  </div>
</div>
