<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>E83-AM · radio</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--body:#d9dbdc;--ink:#1d1f21;--screen:#0b0c0d;--org:#ff6a1a;--blu:#3a7bff;--grn:#19c37d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#9fa3a6;font-family:"JetBrains Mono",ui-monospace,monospace;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
  body{display:flex;align-items:center;justify-content:center;padding:12px}
  .radio{width:min(900px,100%);background:linear-gradient(180deg,#e6e8e9,var(--body) 40%,#c8cbcc);border-radius:22px;padding:20px;
    box-shadow:0 1px 0 #fff inset,0 -2px 0 #0002 inset,0 30px 60px -20px #0008,0 4px 10px #0003;
    display:grid;grid-template-columns:200px 1fr 170px;gap:20px;align-items:center}
  .grille{aspect-ratio:1;border-radius:14px;background:#cfd2d3;box-shadow:0 0 0 1px #0001 inset,0 2px 4px #0002 inset;
    background-image:radial-gradient(circle,#2a2c2e 34%,transparent 38%);background-size:14px 14px;background-position:3px 3px;position:relative}
  .grille .brand{position:absolute;left:10px;bottom:-22px;font-size:10px;letter-spacing:.14em;font-weight:700}
  .grille .brand span{font-weight:400;opacity:.5}
  .mid{display:grid;gap:14px}
  .screenwrap{background:#2a2c2e;border-radius:9px;padding:6px;box-shadow:0 1px 0 #fff8}
  canvas{display:block;width:100%;height:170px;background:var(--screen);border-radius:5px}
  .presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .btn{height:46px;border:none;border-radius:8px;font:inherit;font-size:11px;color:var(--ink);background:linear-gradient(#f5f6f6,#dcdfe0);
    box-shadow:0 2px 0 #0003,0 0 0 1px #0001;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
  .btn small{font-size:8px;opacity:.5;letter-spacing:.05em}
  .btn:active,.btn.on{transform:translateY(1px);box-shadow:0 1px 0 #0003;background:#cfd2d3}
  .btn.on{color:var(--org)}
  .right{display:grid;justify-items:center;gap:22px}
  .knob{border-radius:50%;position:relative;cursor:grab;touch-action:none}
  .knob::after{content:"";position:absolute;left:50%;top:8%;width:5px;height:22%;margin-left:-2.5px;border-radius:3px;background:#0007;transform-origin:50% 190%;transform:rotate(var(--r,0deg))}
  .tune{width:132px;height:132px;background:radial-gradient(circle at 35% 30%,#fff8,#0000 45%),var(--org);
    box-shadow:0 4px 0 #0003,0 10px 20px #0003,0 0 0 6px #c2c5c7,0 0 0 7px #0002}
  .tune::after{transform-origin:50% 205%}
  .vol{width:62px;height:62px;background:radial-gradient(circle at 35% 30%,#fff9,#0000 45%),#f2f2f2;
    box-shadow:0 3px 0 #0003,0 6px 12px #0003,0 0 0 4px #c2c5c7}
  .vol::after{transform-origin:50% 190%}
  .lbl{font-size:9px;opacity:.55;letter-spacing:.1em;text-align:center;margin-top:-12px}
  .row2{display:flex;gap:14px;align-items:center}
  .pwr{width:46px;height:46px;border-radius:50%}
  .led{width:8px;height:8px;border-radius:50%;background:#555;box-shadow:0 0 0 2px #0001}
  .led.on{background:#ff3b2f;box-shadow:0 0 8px #ff3b2f}
  .hint{grid-column:1/-1;font-size:10px;opacity:.55;text-align:center;letter-spacing:.04em;margin-top:6px}
  @media (max-width:760px){
    .radio{grid-template-columns:1fr 130px;gap:14px;padding:14px}
    .grille{display:none}
    .tune{width:104px;height:104px}
    canvas{height:140px}
  }
  @media (max-width:520px){
    .radio{grid-template-columns:1fr}
    .right{grid-template-columns:auto auto;justify-content:center;align-items:center;gap:28px}
  }
</style>
<script>
// KiwiAM: escucha AM "del aire" a través de receptores KiwiSDR públicos cercanos a Buenos Aires.
// Uso: const k = KiwiAM.open(ctx, 950, destinoNode, {onState, onSignal}); k.close();
// Protocolo KiwiSDR (igual que kiwiclient): WebSocket /<ts>/SND, comandos "SET ...",
// audio PCM 16 bits big-endian sin comprimir.
// Los receptores solo hablan ws:// (sin TLS): el navegador lo permite si la página se abre
// desde la compu (file://) o desde http://, y lo bloquea desde páginas https://.
(function(){
  const RECEIVERS = [
    { name: 'RAMOS MEJIA (LU4EEC)',          host: 'lu4eec.ddns.net',         port: 8073 },
    { name: 'RADIO CLUB ARGENTINO (LU4AA)',  host: 'lu4aa.proxy.kiwisdr.com', port: null },
    { name: 'MONTEVIDEO (CX8BIT)',           host: 'cx8bit.proxy.kiwisdr.com',port: null },
  ];
  const base = r => `${r.host}${r.port ? ':' + r.port : ''}`;
  // Página del receptor ya sintonizada (se abre aparte cuando no se puede conectar desde acá)
  const webLink = (khz, r = RECEIVERS[0]) => `http://${base(r)}/?f=${khz}am`;
  const canConnect = () => location.protocol !== 'https:';

  function open(ctx, khz, dest, cb = {}) {
    let ws = null, closed = false, idx = 0, keep = null, playAt = 0, rate = 12000, gotAudio = false, timer = null;
    const state = s => cb.onState && cb.onState(s);
    if (!canConnect()) { setTimeout(() => state('nosig'), 0); return { close() {} }; }

    function next() {
      if (closed) return;
      if (idx >= RECEIVERS.length) { state('nosig'); return; }
      const r = RECEIVERS[idx++];
      state('tuning'); gotAudio = false;
      try { ws = new WebSocket(`ws://${base(r)}/${Date.now()}/SND`); } catch (e) { next(); return; }
      ws.binaryType = 'arraybuffer';
      const send = m => { try { ws.send(m); } catch (e) {} };
      const setup = () => {
        send(`SET mod=am low_cut=-4900 high_cut=4900 freq=${khz.toFixed(3)}`);
        send('SET agc=1 hang=0 thresh=-100 slope=6 decay=1000 manGain=50');
        send('SET squelch=0 max=0');
        send('SET keepalive');
      };
      clearTimeout(timer);
      timer = setTimeout(() => { if (!gotAudio) { try { ws.close(); } catch (e) {} } }, 10000);
      ws.onopen = () => {
        send('SET auth t=kiwi p=');
        send('SET ident_user=E83-radio');
        send('SET compression=0');
        setup();
        keep = setInterval(() => send('SET keepalive'), 4000);
      };
      ws.onmessage = ev => {
        if (typeof ev.data === 'string') return;
        const u8 = new Uint8Array(ev.data);
        const tag = String.fromCharCode(u8[0], u8[1], u8[2]);
        if (tag === 'MSG') {
          const txt = new TextDecoder().decode(u8.subarray(4));
          const ar = txt.match(/audio_rate=(\d+)/);
          if (ar) { rate = +ar[1]; send(`SET AR OK in=${rate} out=44100`); }
          if (/sample_rate=/.test(txt)) { send('SET compression=0'); setup(); }   // el receptor ya está listo
          if (/too_busy|badp=1|down|inactivity_timeout/.test(txt)) { try { ws.close(); } catch (e) {} }
          return;
        }
        if (tag !== 'SND') return;
        // cuerpo: flags(1) seq(4, LE) smeter(2, BE) datos(int16 BE)
        const dv = new DataView(ev.data, 3);
        if (dv.getUint8(0) & 0x10) return;              // llegó comprimido (no debería): se descarta
        const smeter = dv.getUint16(5, false);
        cb.onSignal && cb.onSignal(Math.max(0, Math.min(1, ((smeter * 0.1 - 127) + 110) / 70)));
        const n = (dv.byteLength - 7) >> 1;
        if (n <= 0) return;
        const buf = ctx.createBuffer(1, n, rate), ch = buf.getChannelData(0);
        for (let i = 0; i < n; i++) ch[i] = dv.getInt16(7 + i * 2, false) / 32768;
        const src = ctx.createBufferSource(); src.buffer = buf; src.connect(dest);
        const now = ctx.currentTime;
        if (playAt < now + 0.05 || playAt > now + 1.5) playAt = now + 0.35; // colchón anti-cortes
        src.start(playAt); playAt += buf.duration;
        if (!gotAudio) { gotAudio = true; clearTimeout(timer); state('ok'); }
      };
      ws.onclose = ws.onerror = () => {
        clearInterval(keep); clearTimeout(timer);
        ws.onclose = ws.onerror = null;
        if (closed) return;
        if (gotAudio) { idx = 0; setTimeout(next, 1500); } else next(); // si se cortó, reintenta
      };
    }
    next();
    return { close() { closed = true; clearInterval(keep); clearTimeout(timer); try { ws && ws.close(); } catch (e) {} } };
  }
  window.KiwiAM = { open, webLink, canConnect, RECEIVERS };
})();

</script>
</head>
<body>
<div class="radio">
  <div class="grille"><div class="brand">E83-AM <span>· estudio83</span></div></div>
  <div class="mid">
    <div class="screenwrap"><canvas id="scr"></canvas></div>
    <div class="presets" id="presets"></div>
  </div>
  <div class="right">
    <div>
      <div class="knob tune" id="tune"></div>
    </div>
    <div class="lbl">SINTONÍA</div>
    <div class="row2">
      <div class="knob vol" id="vol"></div>
      <button class="btn pwr" id="pwr" title="Encender"><div class="led" id="led"></div></button>
    </div>
    <div class="lbl">VOLUMEN · ENCENDIDO</div>
  </div>
  <div class="hint">girá la perilla naranja (arrastrar o rueda del mouse · flechas ← →) · los botones saltan a cada emisora</div>
</div>
<script>
(()=>{
// ---- emisoras (señales online de cada radio) ----
const STATIONS=[
  {f:630, name:'RIVADAVIA', url:'https://playerservices.streamtheworld.com/api/livestream-redirect/RIVADAVIA.mp3'},
  {f:790, name:'MITRE',     url:'https://playerservices.streamtheworld.com/api/livestream-redirect/AM790_56AAC.aac'},
  {f:870, name:'NACIONAL',  url:'https://sa.mp3.icecast.magma.edge-access.net/sc_rad1'},
  {f:950, name:'STREAM 950',url:'https://redirector.dps.live/cnn-ar/aac/icecast.audio',kiwi:true}, // señal oficial (solo desde Argentina); si falla, del aire vía KiwiSDR
];
const FMIN=530, FMAX=1710, CAPTURE=12; // kHz alrededor de cada emisora donde se "engancha"
let freq=950, vol=.7, on=false;
let ctx, master, noiseGain, whistle, whistleGain, chainIn, fadeGain;
let cur=null; // {st, el, src, mode:'fx'|'plain', state}

// ---- audio ----
function initAudio(){
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain(); master.gain.value=vol; master.connect(ctx.destination);
  // ruido de estática (rosa-ish, filtrado)
  const len=ctx.sampleRate*2, b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
  let l=0; for(let i=0;i<len;i++){const w=Math.random()*2-1; l=.97*l+.03*w; d[i]=(w*.35+l*2.2)*(Math.random()<.002?3:1);}
  const n=ctx.createBufferSource(); n.buffer=b; n.loop=true;
  const nf=ctx.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=1800; nf.Q.value=.6;
  noiseGain=ctx.createGain(); noiseGain.gain.value=0;
  n.connect(nf).connect(noiseGain).connect(master); n.start();
  // silbido (heterodino) cuando estás cerca pero no justo en la frecuencia
  whistle=ctx.createOscillator(); whistle.type='sine';
  whistleGain=ctx.createGain(); whistleGain.gain.value=0;
  whistle.connect(whistleGain).connect(master); whistle.start();
  // cadena "AM": banda angosta + saturación + desvanecimiento lento
  chainIn=ctx.createGain();
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=260;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3400; lp.Q.value=.9;
  const lp2=ctx.createBiquadFilter(); lp2.type='lowpass'; lp2.frequency.value=4200;
  const sat=ctx.createWaveShaper(); const c=new Float32Array(1024);
  for(let i=0;i<1024;i++){const x=i/511.5-1; c[i]=Math.tanh(x*2.2)/Math.tanh(2.2);} sat.curve=c;
  const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-22; comp.ratio.value=5;
  fadeGain=ctx.createGain(); fadeGain.gain.value=1;
  const lfo=ctx.createOscillator(); lfo.frequency.value=.07; const lfoG=ctx.createGain(); lfoG.gain.value=.18;
  lfo.connect(lfoG).connect(fadeGain.gain); lfo.start();
  chainIn.connect(hp).connect(lp).connect(sat).connect(lp2).connect(comp).connect(fadeGain).connect(master);
}

function nearest(){let best=null,bd=1e9;for(const s of STATIONS){const d=Math.abs(s.f-freq);if(d<bd){bd=d;best=s;}}return {st:best,d:bd};}

function connect(st,aire){
  disconnect();
  if(st.kiwi&&(aire||!st.url)){ // AM real: el audio llega del receptor (ya es AM, va directo)
    const g=ctx.createGain();g.connect(chainIn);
    const c={st,el:null,src:g,mode:'fx',state:'conectando'};cur=c;
    c.kiwi=KiwiAM.open(ctx,st.f,g,{onState:x=>{if(cur===c)c.state=x==='ok'?'ok':x==='nosig'?'sin señal':'conectando';}});
    return;
  }
  const el=new Audio(); el.preload='none';
  const c={st,el,src:null,mode:'fx',state:'conectando'}; cur=c;
  const tryPlay=mode=>{
    c.mode=mode;
    if(mode==='fx'){el.crossOrigin='anonymous';} else {el.removeAttribute('crossorigin');}
    el.src=st.url+(st.url.includes('?')?'&':'?')+'t='+Date.now();
    if(mode==='fx'&&!c.src){try{c.src=ctx.createMediaElementSource(el);c.src.connect(chainIn);}catch(e){}}
    el.play().catch(()=>{});
  };
  el.addEventListener('playing',()=>{if(cur===c)c.state='ok';});
  el.addEventListener('waiting',()=>{if(cur===c)c.state='conectando';});
  el.addEventListener('error',()=>{
    if(cur!==c) return;
    if(c.mode==='fx'){ // sin permiso para procesar: probar reproducción directa (sin filtro AM)
      // un elemento conectado a Web Audio no puede volver a sonar directo; creamos otro
      const el2=new Audio(); el2.preload='none'; c.el.pause(); c.el=el2; c.src=null;
      el2.addEventListener('playing',()=>{if(cur===c)c.state='ok';});
      el2.addEventListener('error',()=>{if(cur===c){if(st.kiwi)connect(st,true); else c.state='sin señal';}});
      c.mode='plain'; el2.src=st.url; el2.play().catch(()=>{if(cur===c){if(st.kiwi)connect(st,true); else c.state='sin señal';}});
    } else if(st.kiwi)connect(st,true); else c.state='sin señal';
  });
  tryPlay('fx');
}
function disconnect(){ if(!cur) return; if(cur.kiwi){cur.kiwi.close();try{cur.src.disconnect();}catch(e){}cur=null;return;} try{cur.el.pause();cur.el.removeAttribute('src');cur.el.load();}catch(e){} try{cur.src&&cur.src.disconnect();}catch(e){} cur=null; }

let connectTimer=null, pendingSt=null;
function update(){
  if(!ctx) return;
  const {st,d}=nearest();
  const t=ctx.currentTime;
  if(!on){ master.gain.setTargetAtTime(0,t,.05); return; }
  master.gain.setTargetAtTime(vol,t,.05);
  const inRange=d<=CAPTURE;
  // conexión con pequeño retardo para no abrir streams mientras girás rápido
  if(inRange && (!cur||cur.st!==st) && pendingSt!==st){ clearTimeout(connectTimer); pendingSt=st;
    connectTimer=setTimeout(()=>{pendingSt=null;const n=nearest(); if(on&&n.d<=CAPTURE&&(!cur||cur.st!==n.st)) connect(n.st);},220); }
  if(!inRange){ if(pendingSt){clearTimeout(connectTimer);pendingSt=null;} if(cur && d>CAPTURE*2.5) disconnect(); }
  // fuerza de señal: 1 en la frecuencia exacta, cae con la distancia
  const sig=inRange?Math.max(0,1-Math.pow(d/CAPTURE,1.4)):0;
  const ok=cur&&cur.state==='ok';
  const s=ok?sig:0;
  if(cur){ if(cur.mode==='fx'){ chainIn.gain.setTargetAtTime(s*1.4,t,.04); } else { cur.el.volume=Math.min(1,s*vol); } }
  noiseGain.gain.setTargetAtTime(.04+(1-s)*.32,t,.04);
  const w=(inRange&&d>.4&&ok)?Math.min(1,(d/CAPTURE))*(1-d/CAPTURE)*.18:0;
  whistle.frequency.setTargetAtTime(120+d*380,t,.03);
  whistleGain.gain.setTargetAtTime(w,t,.04);
  signal=s;
}
let signal=0;

// ---- controles ----
function setFreq(f){ freq=Math.max(FMIN,Math.min(FMAX,f)); renderKnobs(); update(); }
function knobDrag(el,onDelta,onWheel){
  let id=null,last=null;
  el.addEventListener('pointerdown',e=>{id=e.pointerId;el.setPointerCapture(id);last={x:e.clientX,y:e.clientY};el.style.cursor='grabbing';});
  el.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;const dx=e.clientX-last.x,dy=last.y-e.clientY;last={x:e.clientX,y:e.clientY};onDelta(dx+dy);});
  const end=()=>{id=null;el.style.cursor='';}; el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
  el.addEventListener('wheel',e=>{e.preventDefault();onWheel(e.deltaY);},{passive:false});
}
const tuneEl=document.getElementById('tune'), volEl=document.getElementById('vol');
knobDrag(tuneEl,d=>setFreq(freq+d*.6),dy=>setFreq(freq-Math.sign(dy)*(Math.abs(dy)>40?10:2)));
knobDrag(volEl,d=>{vol=Math.max(0,Math.min(1,vol+d/200));renderKnobs();update();},dy=>{vol=Math.max(0,Math.min(1,vol-dy/1000));renderKnobs();update();});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')setFreq(freq+(e.shiftKey?10:1));if(e.key==='ArrowLeft')setFreq(freq-(e.shiftKey?10:1));});
function renderKnobs(){tuneEl.style.setProperty('--r',((freq-FMIN)*1.8)+'deg');volEl.style.setProperty('--r',(-135+vol*270)+'deg');
  document.querySelectorAll('.presets .btn').forEach(b=>b.classList.toggle('on',Math.abs(+b.dataset.f-freq)<1));}

// sintonía animada hacia una emisora (con barrido de estática)
let sweep=null;
function goTo(target){cancelAnimationFrame(sweep);const from=freq,t0=performance.now(),dur=Math.min(900,200+Math.abs(target-from)*2);
  const step=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);setFreq(from+(target-from)*e);if(k<1)sweep=requestAnimationFrame(step);};sweep=requestAnimationFrame(step);}
const pre=document.getElementById('presets');
STATIONS.forEach((s,i)=>{const b=document.createElement('button');b.className='btn';b.dataset.f=s.f;b.innerHTML=`${s.f}<small>${s.name}</small>`;
  b.onclick=()=>{ensureOn();if(s.kiwi&&cur&&cur.st===s&&cur.state==='sin señal'){window.open(KiwiAM.webLink(s.f),'_blank');return;}goTo(s.f);};pre.appendChild(b);});

const led=document.getElementById('led');
function ensureOn(){ if(!ctx){initAudio();} ctx.resume(); if(!on){on=true;led.classList.add('on');update();} }
document.getElementById('pwr').onclick=()=>{ if(!on){ensureOn();} else {on=false;led.classList.remove('on');disconnect();update();} };
tuneEl.addEventListener('pointerdown',()=>{if(!on)ensureOn();});

// ---- pantalla ----
const cv=document.getElementById('scr'), g=cv.getContext('2d');
function fit(){const r=cv.getBoundingClientRect();cv.width=Math.round(r.width*devicePixelRatio);cv.height=Math.round(r.height*devicePixelRatio);}
addEventListener('resize',fit); fit();
function draw(now){
  const W=cv.width,H=cv.height,s=devicePixelRatio; g.fillStyle='#0b0c0d'; g.fillRect(0,0,W,H);
  const F=(px,w)=>`${w||400} ${px*s}px "JetBrains Mono",monospace`;
  g.textBaseline='top';
  // estado
  g.font=F(10); g.fillStyle='#fff7'; g.fillText('AM · BUENOS AIRES',10*s,9*s);
  g.textAlign='right';
  const st=!on?'APAGADA':cur?(cur.state==='ok'?(cur.mode==='fx'?'EN VIVO':'EN VIVO · DIRECTO'):cur.state.toUpperCase()):'BUSCANDO';
  g.fillStyle=on&&cur&&cur.state==='ok'?'#19c37d':'#fff7'; g.fillText(st,W-10*s,9*s); g.textAlign='left';
  // frecuencia grande
  g.font=F(48,700); g.fillStyle=on?'#ff6a1a':'#ff6a1a55'; const ft=Math.round(freq).toString();
  g.fillText(ft,10*s,26*s); const fw=g.measureText(ft).width;
  g.font=F(12); g.fillStyle='#fff8'; g.fillText('kHz',14*s+fw,56*s);
  // nombre de emisora
  const n=nearest(); g.font=F(14,700);
  if(on&&n.d<=CAPTURE&&signal>.35){g.fillStyle=`rgba(255,255,255,${Math.min(1,signal*1.3)})`;g.fillText(n.st.name,10*s,84*s);}
  else if(on&&cur&&cur.state==='sin señal'){g.font=F(10);g.fillStyle='#fff8';g.fillText(cur.st.kiwi?'receptor ocupado · tocá 950 otra vez para abrirlo aparte':'la señal no responde · probá más tarde',10*s,86*s);}
  else if(on){g.fillStyle='#fff3';g.fillText('— — —',10*s,84*s);}
  // barras de señal
  const bx=W-80*s, by=34*s; for(let i=0;i<5;i++){const h=(6+i*6)*s; g.fillStyle=(on&&signal>i/5+.05)?'#3a7bff':'#fff1'; g.fillRect(bx+i*13*s,by+36*s-h,9*s,h);}
  // escala del dial
  const y0=H-46*s, x0=12*s, x1=W-12*s, X=f=>x0+(f-FMIN)/(FMAX-FMIN)*(x1-x0);
  g.strokeStyle='#fff3'; g.lineWidth=1*s; g.beginPath(); g.moveTo(x0,y0+18*s); g.lineTo(x1,y0+18*s); g.stroke();
  g.font=F(8); g.fillStyle='#fff6'; g.textAlign='center';
  for(let f=550;f<=1700;f+=10){const x=X(f),big=f%100===0;g.fillStyle=big?'#fff7':'#fff2';g.fillRect(x,y0+(big?8:13)*s,1*s,(big?10:5)*s);if(big&&(f/100)%2===0){g.fillStyle='#fff6';g.fillText(f,x,y0-4*s);}}
  STATIONS.forEach(st=>{const x=X(st.f);g.fillStyle='#ff6a1a';g.beginPath();g.arc(x,y0+26*s,2.5*s,0,7);g.fill();});
  g.textAlign='left';
  // aguja
  const nx=X(freq); g.fillStyle='#ff3b2f'; g.fillRect(nx-1*s,y0-12*s,2*s,44*s);
  // "estática" visual
  if(on){const amt=(1-signal); g.fillStyle=`rgba(255,255,255,${.05+amt*.12})`;for(let i=0;i<amt*90;i++){g.fillRect(Math.random()*W,Math.random()*(y0-12*s),1.5*s,1.5*s);}}
  update(); requestAnimationFrame(draw);
}
renderKnobs(); requestAnimationFrame(draw);
})();
</script>
