<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>E83-1 · prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --body:#d9dbdc; --body2:#c9cccd; --ink:#1d1f21; --screen:#0b0c0d;
    --c1:#3a7bff; --c2:#19c37d; --c3:#f2f2f2; --c4:#ff6a1a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#9fa3a6;font-family:"JetBrains Mono",ui-monospace,monospace;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
  body{display:flex;align-items:center;justify-content:center;padding:12px}
  .device{
    width:min(980px,100%);
    background:linear-gradient(180deg,#e4e6e7,var(--body) 40%,var(--body2));
    border-radius:18px;padding:18px;
    box-shadow:0 1px 0 #fff inset,0 -2px 0 #0002 inset,0 30px 60px -20px #0007,0 4px 10px #0003;
    display:grid;grid-template-columns:1fr;gap:16px;
  }
  .top{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
  .brand{font-weight:700;letter-spacing:.12em;font-size:12px;line-height:1.3}
  .brand small{display:block;font-weight:400;opacity:.55;letter-spacing:.05em}
  .screenwrap{background:#2a2c2e;border-radius:8px;padding:6px;box-shadow:0 1px 0 #fff8,0 0 0 1px #0004 inset}
  canvas#scr{display:block;width:100%;height:150px;background:var(--screen);border-radius:4px;image-rendering:pixelated}
  .knobs{display:flex;gap:14px}
  .knob{width:58px;height:58px;border-radius:50%;position:relative;cursor:ns-resize;
    background:radial-gradient(circle at 35% 30%,#fff9,#0000 45%),var(--k);
    box-shadow:0 3px 0 #0003,0 6px 12px #0003,0 0 0 4px #bfc2c4,0 0 0 5px #0002;}
  .knob::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:14px;margin-left:-2px;border-radius:2px;background:#0008;transform-origin:2px 23px;transform:rotate(var(--r,0deg))}
  .knob[data-i="2"]::after{background:#0006}
  .knob .lbl{position:absolute;top:66px;left:50%;transform:translateX(-50%);font-size:9px;white-space:nowrap;opacity:.6;letter-spacing:.05em}
  .row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:stretch}
  .side{display:grid;grid-template-columns:repeat(2,44px);gap:8px;align-content:start}
  .btn{height:44px;border-radius:7px;background:linear-gradient(#f4f5f5,#dcdfe0);border:none;font:inherit;font-size:10px;color:var(--ink);
    box-shadow:0 2px 0 #0003,0 0 0 1px #0001;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .btn:active,.btn.on{transform:translateY(1px);box-shadow:0 1px 0 #0003;background:#cfd2d3}
  .btn.on{color:var(--c4)}
  .btn svg{width:20px;height:20px}
  .keys{position:relative;height:150px;display:flex;gap:4px}
  .key{flex:1;position:relative;border-radius:7px;background:linear-gradient(#f6f7f7,#e1e3e4);
    box-shadow:0 3px 0 #0003,0 0 0 1px #0001;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:9px;opacity:1;color:#0005}
  .key.on{background:#cfd2d3;transform:translateY(2px);box-shadow:0 1px 0 #0003}
  .bk{position:absolute;top:0;height:58%;border-radius:6px;background:linear-gradient(#3a3d40,#1f2123);box-shadow:0 3px 0 #0006;z-index:2;color:#fff5;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:9px}
  .bk.on{background:#55595d;transform:translateY(2px)}
  .hint{font-size:10px;opacity:.55;text-align:center;letter-spacing:.04em}
  #start{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9;color:#fff;font-size:14px;letter-spacing:.15em;cursor:pointer}
  #start b{border:1px solid #fff6;padding:16px 28px;border-radius:8px}
  @media (max-width:700px){
    .top{grid-template-columns:1fr;}
    .brand{display:none}
    .knobs{justify-content:space-between;padding:0 6px 18px}
    .row{grid-template-columns:1fr}
    .side{grid-template-columns:repeat(6,1fr);order:2}
    .keys{height:130px}
    .key span,.bk span{display:none}
  }
</style>
</head>
<body>
<div id="start"><b>TOCÁ PARA ENCENDER</b></div>
<div class="device">
  <div class="top">
    <div class="brand">E83-1<small>estudio83 · v0.1</small></div>
    <div class="screenwrap"><canvas id="scr" width="640" height="150"></canvas></div>
    <div class="knobs" id="knobs"></div>
  </div>
  <div class="row">
    <div class="side">
      <button class="btn" id="eng" title="Motor">SYN</button>
      <button class="btn" id="arp" title="Arpegio">ARP</button>
      <button class="btn" id="octd" title="Octava -"><svg viewBox="0 0 20 20"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      <button class="btn" id="octu" title="Octava +"><svg viewBox="0 0 20 20"><path d="M5 12l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      <button class="btn" id="rec" title="Cinta"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="5" fill="#ff3b2f"/></svg></button>
      <button class="btn" id="play" title="Play cinta"><svg viewBox="0 0 20 20"><path d="M7 5l8 5-8 5z" fill="currentColor"/></svg></button>
    </div>
    <div class="keys" id="keys"></div>
  </div>
  <div class="hint">teclado: A–K blancas · W E T Y U negras · Z/X octava · arrastrá los knobs (o rueda del mouse)</div>
</div>
<script>
(()=>{
const COLORS=['#3a7bff','#19c37d','#f2f2f2','#ff6a1a'];
const ENGINES=[
  {name:'PULSE', p:['ANCHO','FILTRO','RESO','DELAY']},
  {name:'FM',    p:['RATIO','INDICE','BRILLO','DELAY']},
  {name:'CUERDA',p:['TONO','DECAY','CUERPO','DELAY']},
];
let eng=0, vals=[[.5,.6,.3,.25],[.3,.4,.6,.25],[.5,.6,.5,.3]], oct=0, arpOn=false;
let ctx, master, delay, fb, dmix, analyser, filtNode;
const voices=new Map();

// ---- audio ----
function initAudio(){
  ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  master=ctx.createGain(); master.gain.value=.5;
  const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
  analyser=ctx.createAnalyser(); analyser.fftSize=1024;
  delay=ctx.createDelay(1); delay.delayTime.value=.33;
  fb=ctx.createGain(); fb.gain.value=.35;
  dmix=ctx.createGain();
  const tone=ctx.createBiquadFilter(); tone.type='lowpass'; tone.frequency.value=3500;
  master.connect(comp); master.connect(delay); delay.connect(tone); tone.connect(fb); fb.connect(delay); tone.connect(dmix); dmix.connect(comp);
  comp.connect(analyser); analyser.connect(ctx.destination);
  applyParams();
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function applyParams(){
  if(!ctx) return; const v=vals[eng];
  dmix.gain.setTargetAtTime(v[3]*.9,ctx.currentTime,.03);
  voices.forEach(vo=>vo.update&&vo.update());
}
function noteOn(m){
  if(!ctx||voices.has(m)) return;
  const t=ctx.currentTime, f=mtof(m), v=vals[eng];
  const out=ctx.createGain(); out.gain.value=0; out.connect(master);
  const vo={out,nodes:[]};
  if(eng===0){
    const o1=ctx.createOscillator(), o2=ctx.createOscillator();
    o1.type='square'; o2.type='sawtooth'; o1.frequency.value=f; o2.frequency.value=f; o2.detune.value=7+v[0]*20;
    const g1=ctx.createGain(), g2=ctx.createGain();
    const lp=ctx.createBiquadFilter(); lp.type='lowpass';
    o1.connect(g1).connect(lp); o2.connect(g2).connect(lp); lp.connect(out);
    vo.update=()=>{const v=vals[0];g1.gain.value=.3*(1-v[0]);g2.gain.value=.3*v[0]+.05;
      lp.frequency.setTargetAtTime(120+Math.pow(v[1],2)*9000,ctx.currentTime,.02);lp.Q.value=.5+v[2]*18;};
    vo.update(); o1.start(t);o2.start(t); vo.nodes=[o1,o2];
    out.gain.linearRampToValueAtTime(.8,t+.01);
  } else if(eng===1){
    const car=ctx.createOscillator(), mod=ctx.createOscillator(), mg=ctx.createGain();
    const lp=ctx.createBiquadFilter(); lp.type='lowpass';
    car.frequency.value=f; mod.connect(mg).connect(car.frequency); car.connect(lp).connect(out);
    vo.update=()=>{const v=vals[1];const r=[.5,1,1.5,2,3,3.5,4,7][Math.round(v[0]*7)];
      mod.frequency.value=f*r; mg.gain.setTargetAtTime(f*v[1]*8,ctx.currentTime,.02);
      lp.frequency.value=400+v[2]*12000;};
    vo.update(); car.start(t);mod.start(t); vo.nodes=[car,mod];
    out.gain.linearRampToValueAtTime(.7,t+.005); out.gain.setTargetAtTime(.35,t+.01,.4);
  } else {
    // karplus-strong aproximado: ruido -> delay con feedback
    const len=Math.floor(ctx.sampleRate*.03), buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const dl=ctx.createDelay(.1); dl.delayTime.value=1/f;
    const fg=ctx.createGain(), damp=ctx.createBiquadFilter(); damp.type='lowpass';
    const body=ctx.createBiquadFilter(); body.type='peaking'; body.frequency.value=220; body.gain.value=6;
    src.connect(dl); dl.connect(damp).connect(fg).connect(dl); damp.connect(body).connect(out);
    vo.update=()=>{const v=vals[2];damp.frequency.value=800+v[0]*9000;fg.gain.value=.9+v[1]*.095;body.gain.value=v[2]*14-2;};
    vo.update(); src.start(t); vo.nodes=[src];
    out.gain.value=.9;
  }
  voices.set(m,vo); setKey(m,true);
}
function noteOff(m){
  const vo=voices.get(m); if(!vo) return; voices.delete(m); setKey(m,false);
  const t=ctx.currentTime, rel=eng===2?.8:.25;
  vo.out.gain.cancelScheduledValues(t); vo.out.gain.setValueAtTime(vo.out.gain.value,t);
  vo.out.gain.setTargetAtTime(0,t,rel/4);
  vo.nodes.forEach(n=>{try{n.stop(t+rel+.1)}catch(e){}});
  setTimeout(()=>vo.out.disconnect(),(rel+.3)*1000);
}

// ---- knobs ----
const knobsEl=document.getElementById('knobs'), knobEls=[];
COLORS.forEach((c,i)=>{
  const k=document.createElement('div'); k.className='knob'; k.dataset.i=i; k.style.setProperty('--k',c);
  k.innerHTML='<span class="lbl"></span>'; knobsEl.appendChild(k); knobEls.push(k);
  let y0,v0,id=null;
  k.addEventListener('pointerdown',e=>{id=e.pointerId;k.setPointerCapture(id);y0=e.clientY;v0=vals[eng][i];});
  k.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;setVal(i,v0+(y0-e.clientY)/160);});
  k.addEventListener('pointerup',()=>id=null); k.addEventListener('pointercancel',()=>id=null);
  k.addEventListener('wheel',e=>{e.preventDefault();setVal(i,vals[eng][i]-e.deltaY/1500);},{passive:false});
});
let lastTouched=-1, touchT=0;
function setVal(i,v){vals[eng][i]=Math.max(0,Math.min(1,v));lastTouched=i;touchT=performance.now();renderKnobs();applyParams();}
function renderKnobs(){knobEls.forEach((k,i)=>{k.style.setProperty('--r',(-135+vals[eng][i]*270)+'deg');k.querySelector('.lbl').textContent=ENGINES[eng].p[i];});}

// ---- keyboard ----
const keysEl=document.getElementById('keys');
const WHITE=[0,2,4,5,7,9,11], QW='awsedftgyhujkolp;';
const QMAP={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:15,'ñ':16,';':16};
const BASE=()=>48+oct*12;
const keyEls={};
function buildKeys(){
  keysEl.innerHTML='';
  const whites=[];for(let o=0;o<2;o++)WHITE.forEach(s=>whites.push(o*12+s));whites.push(24);
  const w=100/whites.length;
  whites.forEach(n=>{const d=document.createElement('div');d.className='key';d.dataset.n=n;keysEl.appendChild(d);keyEls[n]=d;});
  whites.forEach((n,idx)=>{ if([0,2,5,7,9].includes(n%12)&&n<24){const d=document.createElement('div');d.className='bk';d.dataset.n=n+1;
    d.style.left=`calc(${(idx+1)*w}% - ${w*0.32}%)`;d.style.width=`${w*0.64}%`;keysEl.appendChild(d);keyEls[n+1]=d;}});
}
function setKey(m,on){const el=keyEls[m-BASE()];if(el)el.classList.toggle('on',on);}
const ptrNote=new Map();
function noteAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.dataset.n!==undefined?BASE()+ +el.dataset.n:null;}
keysEl.addEventListener('pointerdown',e=>{keysEl.setPointerCapture(e.pointerId);const n=noteAt(e.clientX,e.clientY);if(n!=null){ptrNote.set(e.pointerId,n);press(n);}});
keysEl.addEventListener('pointermove',e=>{if(!ptrNote.has(e.pointerId))return;const n=noteAt(e.clientX,e.clientY),p=ptrNote.get(e.pointerId);if(n!=null&&n!==p){release(p);press(n);ptrNote.set(e.pointerId,n);}});
const up=e=>{const p=ptrNote.get(e.pointerId);if(p!=null){release(p);ptrNote.delete(e.pointerId);}};
keysEl.addEventListener('pointerup',up);keysEl.addEventListener('pointercancel',up);
const held=new Set();
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();
  if(k==='z'){shiftOct(-1);return;} if(k==='x'){shiftOct(1);return;}
  if(k in QMAP){held.add(k);press(BASE()+QMAP[k]);}});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k in QMAP){held.delete(k);release(BASE()+QMAP[k]);}});

// ---- arp ----
const arpHeld=new Set(); let arpIdx=0, arpCur=null, arpTimer=null;
function press(n){ if(arpOn){arpHeld.add(n);setKey(n,true);} else { noteOn(n); tapeEvt(n,1);} }
function release(n){ if(arpOn){arpHeld.delete(n);setKey(n,false);} else { noteOff(n); tapeEvt(n,0);} }
function arpTick(){ if(arpCur!=null){noteOff(arpCur);arpCur=null;}
  const ns=[...arpHeld].sort((a,b)=>a-b); if(!ns.length) return;
  const n=ns[arpIdx++%ns.length]+(Math.floor(arpIdx/ns.length)%2)*12; noteOn(n); arpCur=n; setTimeout(()=>{ns.forEach(x=>arpHeld.has(x)&&setKey(x,true))},0);}
document.getElementById('arp').onclick=e=>{arpOn=!arpOn;e.currentTarget.classList.toggle('on',arpOn);
  clearInterval(arpTimer); if(arpOn) arpTimer=setInterval(arpTick,125); else {if(arpCur!=null)noteOff(arpCur);arpHeld.forEach(n=>setKey(n,false));arpHeld.clear();}};

function shiftOct(d){[...voices.keys()].forEach(noteOff);oct=Math.max(-2,Math.min(2,oct+d));flash='OCT '+(oct>0?'+':'')+oct;flashT=performance.now();}
document.getElementById('octu').onclick=()=>shiftOct(1);
document.getElementById('octd').onclick=()=>shiftOct(-1);
document.getElementById('eng').onclick=()=>{[...voices.keys()].forEach(noteOff);eng=(eng+1)%ENGINES.length;renderKnobs();applyParams();flash=ENGINES[eng].name;flashT=performance.now();};

// ---- "cinta": graba eventos de notas en un loop de 4 compases ----
const LOOP=8; let tape=[], recOn=false, playOn=false, t0=0, lastPos=0;
function tapeEvt(n,on){ if(recOn) tape.push({t:((performance.now()-t0)/1000)%LOOP,n,on,e:eng}); }
document.getElementById('rec').onclick=e=>{recOn=!recOn;e.currentTarget.classList.toggle('on',recOn);if(recOn&&!playOn){t0=performance.now();playOn=true;document.getElementById('play').classList.add('on');}};
document.getElementById('play').onclick=e=>{playOn=!playOn;e.currentTarget.classList.toggle('on',playOn);if(playOn)t0=performance.now();else{recOn=false;document.getElementById('rec').classList.remove('on');[...voices.keys()].forEach(noteOff);}};
function tapeRun(){ if(!playOn) return; const pos=((performance.now()-t0)/1000)%LOOP;
  tape.forEach(ev=>{const crossed=pos>=lastPos?(ev.t>lastPos&&ev.t<=pos):(ev.t>lastPos||ev.t<=pos);
    if(crossed&&!(recOn&&Math.abs(ev.t-pos)<.02)){const pe=eng;eng=ev.e;ev.on?noteOn(ev.n+0):noteOff(ev.n);eng=pe;}});
  lastPos=pos; }

// ---- pantalla ----
const cv=document.getElementById('scr'), g=cv.getContext('2d'); let flash='', flashT=0, wave=new Uint8Array(1024);
function fit(){const r=cv.getBoundingClientRect();cv.width=Math.round(r.width*devicePixelRatio);cv.height=Math.round(r.height*devicePixelRatio);}
addEventListener('resize',fit);
function draw(now){
  tapeRun();
  const W=cv.width,H=cv.height,s=devicePixelRatio; g.fillStyle='#0b0c0d';g.fillRect(0,0,W,H);
  g.font=`${10*s}px "JetBrains Mono",monospace`; g.textBaseline='top';
  // header
  g.fillStyle='#fff8'; g.fillText(ENGINES[eng].name,10*s,8*s);
  g.textAlign='right'; g.fillText((playOn?(recOn?'● REC ':'▶ ')+(((now-t0)/1000)%LOOP).toFixed(1).padStart(4,'0'):'■ --.-')+'   OCT '+(oct>0?'+':'')+oct,W-10*s,8*s); g.textAlign='left';
  // carretes
  const ang=playOn?(now/1000)*3:0;
  [[W*.12,H*.58],[W*.3,H*.58]].forEach(([x,y],j)=>{g.strokeStyle='#fff3';g.lineWidth=2*s;g.beginPath();g.arc(x,y,Math.min(H*.26,W*.085),0,7);g.stroke();
    for(let k=0;k<3;k++){const a=ang*(j?1.2:1)+k*2.094;g.strokeStyle=COLORS[k];g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*Math.min(H*.2,W*.065),y+Math.sin(a)*Math.min(H*.2,W*.065));g.stroke();}
    g.fillStyle='#0b0c0d';g.beginPath();g.arc(x,y,4*s,0,7);g.fill();});
  g.strokeStyle='#fff2';g.beginPath();g.moveTo(W*.12,H*.84);g.lineTo(W*.3,H*.84);g.stroke();
  // onda
  if(analyser){analyser.getByteTimeDomainData(wave);}
  const x0=W*.42,w=W*.56,yc=H*.55,amp=H*.32;
  g.strokeStyle=COLORS[3];g.lineWidth=2*s;g.beginPath();
  for(let i=0;i<256;i++){const v=analyser?(wave[i*2]-128)/128:Math.sin(i/12+now/400)*.08;const x=x0+i/255*w,y=yc-v*amp;i?g.lineTo(x,y):g.moveTo(x,y);} g.stroke();
  // barras de parámetros
  const v=vals[eng];
  v.forEach((p,i)=>{const bx=x0+i*(w/4),bw=w/4-8*s,by=H-14*s;g.fillStyle='#fff1';g.fillRect(bx,by,bw,5*s);g.fillStyle=COLORS[i];g.fillRect(bx,by,bw*p,5*s);});
  // cinta: eventos
  if(tape.length){g.fillStyle='#fff5';tape.forEach(ev=>{if(ev.on){const x=W*.12+(ev.t/LOOP)*(W*.18);g.fillRect(x,H*.84-3*s,2*s,6*s);}});}
  // overlay parámetro tocado / flash
  const since=now-touchT;
  if(lastTouched>=0&&since<900){g.fillStyle='#0b0c0de0';g.fillRect(x0,H*.2,w,H*.5);
    g.fillStyle=COLORS[lastTouched];g.font=`bold ${22*s}px "JetBrains Mono",monospace`;
    g.fillText(ENGINES[eng].p[lastTouched]+'  '+Math.round(v[lastTouched]*100),x0+10*s,H*.32);}
  if(now-flashT<900&&flash){g.fillStyle='#0b0c0de0';g.fillRect(x0,H*.2,w,H*.5);g.fillStyle='#fff';g.font=`bold ${22*s}px "JetBrains Mono",monospace`;g.fillText(flash,x0+10*s,H*.32);}
  requestAnimationFrame(draw);
}

buildKeys(); renderKnobs(); fit(); requestAnimationFrame(draw);
document.getElementById('start').addEventListener('pointerdown',e=>{try{initAudio();ctx.resume();}catch(err){} e.currentTarget.remove();});
})();
</script>
</body>
</html>
