<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>E83 · autoradio</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--panel:#3b3d3f;--panel2:#2f3133;--key:#2b2d2f;--lcd1:#c5cdbd;--lcd2:#aab4a3;--ink:#1b2320}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:#1c1d1e;font-family:Inter,system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  body{display:flex;align-items:center;justify-content:center;padding:16px;min-height:100vh}
  .unit{width:min(560px,100%);border-radius:18px;padding:22px 22px 26px;
    background:linear-gradient(180deg,#46484a,var(--panel) 30%,var(--panel2));
    box-shadow:0 0 0 2px #1a1b1c,0 0 0 3px #555,0 30px 60px -20px #000c,inset 0 1px 0 #ffffff22}
  /* display con visera */
  .bezel{background:#2a2b2d;border-radius:12px;padding:0 14px 16px;box-shadow:inset 0 2px 6px #000a,0 1px 0 #ffffff14}
  .hood{height:46px;margin:0 -14px 12px;border-radius:12px 12px 6px 6px;background:linear-gradient(180deg,#38393b,#232425 70%,#1b1c1d);
    box-shadow:0 8px 14px -4px #000c,inset 0 1px 0 #ffffff1a}
  .lcd{position:relative;height:118px;border-radius:4px;overflow:hidden;
    background:linear-gradient(180deg,var(--lcd1),var(--lcd2));box-shadow:inset 0 3px 10px #0007,inset 0 0 0 2px #0004;
    font-family:"Share Tech Mono",monospace;color:var(--ink)}
  .lcd::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 2px,#0000000a 2px 3px);pointer-events:none}
  .lcd.off{background:linear-gradient(180deg,#8d9588,#7b8377)}
  .lcd.off *{opacity:.06}
  .clock{position:absolute;left:12px;top:8px;font-size:17px;letter-spacing:1px}
  .band{position:absolute;left:0;right:0;top:6px;text-align:center;font-size:22px;letter-spacing:1px}
  .freq{position:absolute;left:0;right:0;top:30px;text-align:center;font-size:44px;letter-spacing:2px;line-height:1}
  .freq.txt{font-size:34px;top:36px}
  .sub{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:14px;letter-spacing:1px}
  .left{position:absolute;left:12px;bottom:10px;font-size:13px;line-height:1.25}
  .left b{font-weight:400;border:1.5px solid var(--ink);padding:0 3px;border-radius:2px;font-size:11px}
  .ramp{position:absolute;right:12px;bottom:12px;width:48px;height:22px}
  .ramp i{position:absolute;inset:0;clip-path:polygon(0 100%,100% 0,100% 100%);border:0;background:linear-gradient(90deg,var(--ink) var(--s,0%),#1b232026 var(--s,0%))}
  .ramp::before{content:"";position:absolute;inset:0;clip-path:polygon(0 100%,100% 0,100% 100%,0 100%);outline:1.5px solid var(--ink)}
  .st{position:absolute;right:12px;top:10px;font-size:12px}
  /* controles */
  .controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-top:22px}
  .keys{display:grid;grid-template-columns:repeat(3,64px);gap:5px;background:#1d1e1f;padding:5px;border-radius:9px;box-shadow:inset 0 1px 3px #000c,0 1px 0 #ffffff12}
  .k{height:42px;border:none;border-radius:4px;background:linear-gradient(180deg,#3a3c3e,var(--key) 60%,#252728);color:#e9ecee;
    font:600 13px Inter,sans-serif;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff1f,0 1px 0 #000;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;position:relative}
  .k::after{content:"";position:absolute;left:10px;right:10px;bottom:6px;height:2px;border-radius:2px;background:#ffffff10}
  .k.small{height:28px;font-size:10px;padding-top:0;align-items:center;letter-spacing:.03em}
  .k.small::after{display:none}
  .k:active,.k.on{background:linear-gradient(180deg,#252728,#2b2d2f);transform:translateY(1px)}
  .k.on{color:#ff9a4a}
  .menu{grid-column:2;height:26px;font-size:10px;letter-spacing:.06em;align-items:center;padding:0}
  .menu::after{display:none}
  .knobwrap{display:grid;justify-items:center}
  .knob{width:104px;height:104px;border-radius:50%;position:relative;cursor:grab;touch-action:none;
    background:conic-gradient(from 20deg,#9a9ea2,#f2f4f5,#8b8f93,#e4e6e8,#7d8185,#f5f6f7,#9a9ea2);
    box-shadow:0 0 0 3px #1c1d1e,0 8px 16px #000a}
  .knob .cap{position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#45474a,#232526 70%);
    box-shadow:inset 0 2px 3px #ffffff26,inset 0 -3px 6px #000a;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#eef0f2;font:600 11px Inter,sans-serif;letter-spacing:.05em;line-height:1.5}
  .knob .cap small{font-size:8px;opacity:.85}
  .knob .grip{position:absolute;inset:0;border-radius:50%;transform:rotate(var(--r,0deg));pointer-events:none}
  .knob .grip::before{content:"";position:absolute;left:50%;top:2px;width:3px;height:6px;margin-left:-1.5px;background:#555a;border-radius:2px}
  .note{margin-top:16px;color:#ffffff55;font-size:10px;text-align:center;letter-spacing:.03em}
  @media (max-width:520px){
    .unit{padding:16px 12px 20px}
    .controls{grid-template-columns:1fr;justify-items:center}
    .knobs-row{display:flex;gap:40px}
    .keys{grid-template-columns:repeat(3,72px)}
    .lcd{height:110px}
  }
  @media (min-width:521px){.knobs-row{display:contents}}
</style>
<script src="kiwi-am.js"></script>
</head>
<body>
<div class="unit">
  <div class="bezel">
    <div class="hood"></div>
    <div class="lcd off" id="lcd">
      <div class="clock" id="clock">--:--</div>
      <div class="band" id="band">AM1</div>
      <div class="st" id="st"></div>
      <div class="freq" id="freq">950</div>
      <div class="left" id="left"></div>
      <div class="sub" id="sub"></div>
      <div class="ramp"><i id="ramp"></i></div>
    </div>
  </div>
  <div class="controls">
    <div class="knobs-row">
      <div class="knobwrap" style="order:0"><div class="knob" id="vol"><div class="grip"></div><div class="cap">VOLUME<small>POWER</small></div></div></div>
      <div class="knobwrap" style="order:2"><div class="knob" id="tune"><div class="grip"></div><div class="cap">TUNING<small>SOUND</small></div></div></div>
    </div>
    <div style="order:1;display:grid;gap:6px;justify-items:center">
      <div class="keys" id="keys"></div>
      <div class="keys" style="grid-template-columns:repeat(3,64px);background:none;box-shadow:none;padding:0 5px"><span></span><button class="k menu" id="menu">MENU</button><span></span></div>
    </div>
  </div>
  <div class="note">girá TUNING para sintonizar · tocá VOLUME para encender · mantené apretado 1–9 para guardar</div>
</div>
<script>
(()=>{
// ---------- emisoras (señales online de cada radio) ----------
const SL='https://playerservices.streamtheworld.com/api/livestream-redirect/';
const BANDS={
  AM:{min:530,max:1710,step:10,fmt:f=>String(f),unit:'kHz',stations:[
    {f:630,name:'RIVADAVIA',url:SL+'RIVADAVIA.mp3'},
    {f:790,name:'MITRE',url:SL+'AM790_56AAC.aac'},
    {f:870,name:'NACIONAL',url:'https://sa.mp3.icecast.magma.edge-access.net/sc_rad1'},
    {f:950,name:'STREAM 950',url:'https://redirector.dps.live/cnn-ar/aac/icecast.audio',kiwi:true}, // señal oficial (solo desde Argentina); si falla, del aire vía KiwiSDR
  ]},
  FM:{min:87.5,max:108,step:.1,fmt:f=>f.toFixed(1),unit:'MHz',stations:[
    {f:94.3,name:'DISNEY',url:SL+'DISNEY_ARG_BA.mp3'},
    {f:95.1,name:'METRO',url:SL+'METRO.mp3'},
    {f:95.9,name:'ROCK&POP',url:SL+'ROCKANDPOP.mp3'},
    {f:99.9,name:'LA 100',url:SL+'FM999_56.mp3'},
    {f:100.7,name:'BLUE',url:SL+'BLUE_FM_100_7AAC.aac'},
    {f:102.3,name:'ASPEN',url:SL+'ASPEN.mp3'},
  ]},
};
const DEFAULT_PRESETS={AM1:[630,790,870,950,null,null,null,null,null],FM1:[94.3,95.1,95.9,99.9,100.7,102.3,null,null,null]};
let store={}; try{store=JSON.parse(localStorage.getItem('e83c30')||'{}');}catch(e){}
const S={on:false,band:'AM1',freq:{AM1:950,FM1:95.9},vol:.6,mode:0,classic:true,presets:store.presets||DEFAULT_PRESETS,lastP:null,scan:null};
const save=()=>{try{localStorage.setItem('e83c30',JSON.stringify({presets:S.presets}));}catch(e){}};
const B=()=>BANDS[S.band.slice(0,2)];
const F=()=>S.freq[S.band];
const stationAt=f=>B().stations.find(s=>Math.abs(s.f-f)<B().step/2);

// ---------- audio ----------
let ctx,master,noiseG,chainIn,cleanIn,cur=null;
function initAudio(){
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain(); master.gain.value=0; master.connect(ctx.destination);
  const len=ctx.sampleRate*2,b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);
  let l=0; for(let i=0;i<len;i++){const w=Math.random()*2-1;l=.97*l+.03*w;d[i]=(w*.35+l*2.2)*(Math.random()<.002?3:1);}
  const n=ctx.createBufferSource();n.buffer=b;n.loop=true;
  const nf=ctx.createBiquadFilter();nf.type='bandpass';nf.frequency.value=1800;nf.Q.value=.5;
  noiseG=ctx.createGain();noiseG.gain.value=0;n.connect(nf).connect(noiseG).connect(master);n.start();
  // cadena AM "clásica"
  chainIn=ctx.createGain();chainIn.gain.value=0;
  const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=260;
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3400;
  const sat=ctx.createWaveShaper();const c=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/511.5-1;c[i]=Math.tanh(x*2.2)/Math.tanh(2.2);}sat.curve=c;
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-22;comp.ratio.value=5;
  chainIn.connect(hp).connect(lp).connect(sat).connect(comp).connect(master);
  // cadena limpia (FM o sonido "CLEAN")
  cleanIn=ctx.createGain();cleanIn.gain.value=0;cleanIn.connect(master);
}
function disconnect(){if(!cur)return;if(cur.kiwi){cur.kiwi.close();try{cur.src.disconnect();}catch(e){}cur=null;return;}try{cur.el.pause();cur.el.removeAttribute('src');cur.el.load();}catch(e){}try{cur.src&&cur.src.disconnect();}catch(e){}cur=null;}
function connect(st,aire){
  disconnect();
  if(st.kiwi&&(aire||!st.url)){ // AM real: el audio llega del receptor y entra a la misma cadena
    const g=ctx.createGain();g.connect(chainIn);g.connect(cleanIn);
    const c={st,el:null,src:g,mode:'kiwi',state:'tuning'};cur=c;
    c.kiwi=KiwiAM.open(ctx,st.f,g,{onState:x=>{if(cur===c)c.state=x;}});
    return;
  } const c={st,el:new Audio(),src:null,mode:'fx',state:'tuning'}; cur=c;
  const el=c.el; el.crossOrigin='anonymous'; el.preload='none';
  try{c.src=ctx.createMediaElementSource(el);c.src.connect(chainIn);c.src.connect(cleanIn);}catch(e){}
  el.addEventListener('playing',()=>{if(cur===c)c.state='ok';});
  el.addEventListener('waiting',()=>{if(cur===c)c.state='tuning';});
  el.addEventListener('error',()=>{
    if(cur!==c)return;
    if(c.mode==='fx'){const e2=new Audio();c.el=e2;c.mode='plain';c.src=null;
      e2.addEventListener('playing',()=>{if(cur===c)c.state='ok';});e2.addEventListener('error',()=>{if(cur===c){if(st.kiwi)connect(st,true); else c.state='nosig';}});
      e2.src=st.url;e2.play().catch(()=>{if(cur===c){if(st.kiwi)connect(st,true); else c.state='nosig';}});}
    else if(st.kiwi)connect(st,true); else c.state='nosig';
  });
  el.src=st.url+(st.url.includes('?')?'&':'?')+'t='+Date.now(); el.play().catch(()=>{});
}
let tuneTimer=null;
function retune(){ // al cambiar de frecuencia: conectar con un pequeño retardo
  clearTimeout(tuneTimer); const st=stationAt(F());
  if(!st){disconnect();return;}
  if(cur&&cur.st===st)return;
  disconnect(); tuneTimer=setTimeout(()=>{if(S.on&&stationAt(F())===st)connect(st);},250);
}
function mix(){
  if(!ctx)return; const t=ctx.currentTime, am=S.band.startsWith('AM');
  master.gain.setTargetAtTime(S.on?S.vol:0,t,.05);
  const ok=cur&&cur.state==='ok', s=ok?1:0;
  const classic=am&&S.classic;
  if(cur&&cur.mode==='plain'){cur.el.volume=S.on?S.vol*s:0;}
  chainIn.gain.setTargetAtTime(classic?s*1.3:0,t,.04);
  cleanIn.gain.setTargetAtTime(!classic?s:0,t,.04);
  // ruido: AM con estática entre emisoras; FM con soplido apagado (mute)
  const nz=ok?(classic?.03:0):(am?.32:(cur?.05:.12));
  noiseG.gain.setTargetAtTime(S.on?nz:0,t,.05);
  signal=ok?1:(cur?.25:0);
}
let signal=0;

// ---------- pantalla ----------
const $=id=>document.getElementById(id);
let msg=null,msgT=0;
function flash(t,ms=1400){msg=t;msgT=performance.now()+ms;}
function render(){
  $('lcd').classList.toggle('off',!S.on);
  const d=new Date(); $('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  $('band').textContent=S.scan?S.band+' SCAN':S.band;
  const st=stationAt(F()), fz=$('freq'), sub=$('sub');
  const p=S.presets[S.band].findIndex(x=>x!=null&&Math.abs(x-F())<B().step/2);
  if(msg&&performance.now()<msgT){fz.textContent=msg;fz.classList.add('txt');}
  else if(S.mode===1&&st){fz.textContent=st.name;fz.classList.add('txt');}
  else {fz.textContent=B().fmt(F());fz.classList.remove('txt');}
  const state=cur?cur.state:null;
  sub.textContent=st?(state==='ok'?(S.mode===1?B().fmt(F())+' '+B().unit:st.name+(st.kiwi?' · AIRE':'')):state==='nosig'?(st.kiwi?'NO RX · TOCÁ DE NUEVO':'NO SIGNAL'):(st.kiwi?'AIRE · CONECTANDO…':'TUNING…')):B().unit;
  $('left').innerHTML=(p>=0?'<b>P'+(p+1)+'</b> ':'')+(S.band.startsWith('AM')?(S.classic?'CLASSIC':'CLEAN'):'');
  $('st').textContent=(!S.band.startsWith('AM')&&state==='ok')?'ST':'';
  $('ramp').style.setProperty('--s',(S.on?signal*100:0)+'%');
  document.querySelectorAll('[data-p]').forEach(k=>k.classList.toggle('on',S.on&&+k.dataset.p===p));
  mix(); requestAnimationFrame(render);
}

// ---------- acciones ----------
function ensureAudio(){if(!ctx)initAudio();ctx.resume();}
function power(v){ensureAudio();S.on=v??!S.on;if(S.on){flash('HELLO',900);retune();}else{stopScan();disconnect();}}
function setFreq(f){const b=B();f=Math.round(f/b.step)*b.step;if(f>b.max)f=b.min;if(f<b.min)f=b.max;S.freq[S.band]=+f.toFixed(1);retune();}
function stepTune(dir){if(!S.on)return;stopScan();setFreq(F()+dir*B().step);}
function seek(dir=1){if(!S.on)return;const list=B().stations.map(s=>s.f).sort((a,b)=>a-b);
  let n=list.find(f=>f>F()+B().step/2);if(dir<0)n=[...list].reverse().find(f=>f<F()-B().step/2);
  if(n==null)n=dir>0?list[0]:list[list.length-1];flash('SEEK',500);setFreq(n);}
function stopScan(){if(S.scan){clearInterval(S.scan);S.scan=null;}}
function scan(){if(!S.on)return;if(S.scan){stopScan();flash('SCAN OFF',800);return;}seek(1);S.scan=setInterval(()=>seek(1),8000);}
function preset(i){if(!S.on)return;stopScan();const f=S.presets[S.band][i];
  if(cur&&cur.st.kiwi&&cur.state==='nosig'&&f!=null&&Math.abs(f-F())<B().step/2){window.open(KiwiAM.webLink(cur.st.f),'_blank');return;}if(f==null){flash('P'+(i+1)+' EMPTY',900);return;}setFreq(f);}
function storePreset(i){if(!S.on)return;S.presets[S.band][i]=F();save();flash('STORED P'+(i+1));}
function band(){if(!S.on)return;stopScan();S.band=S.band==='AM1'?'FM1':'AM1';retune();}
function mode(){if(!S.on)return;S.mode=(S.mode+1)%2;flash(S.mode?'NAME':'FREQ',700);}
function sound(){if(!S.on)return;S.classic=!S.classic;flash(S.classic?'CLASSIC AM':'CLEAN',1000);}

// ---------- teclado ----------
const KEYS=[['AM/FM','small',band],['▲','small',()=>flash('NO DISC')],['MODE','small',mode],
  ...[1,2,3,4,5,6,7,8,9].map(n=>[String(n),'',null,n-1]),
  ['AUTO','',()=>seek(1)],['0','',()=>flash('P0 —',600)],['SCAN','',scan]];
const keysEl=$('keys');
KEYS.forEach(([label,cls,fn,p])=>{const b=document.createElement('button');b.className='k '+cls;b.textContent=label;
  if(p!=null){b.dataset.p=p;let t=null,long=false;
    b.addEventListener('pointerdown',()=>{long=false;t=setTimeout(()=>{long=true;storePreset(p);},650);});
    const up=()=>{clearTimeout(t);if(!long)preset(p);};b.addEventListener('pointerup',up);b.addEventListener('pointerleave',()=>clearTimeout(t));}
  else b.addEventListener('click',()=>{ensureAudio();fn();});
  keysEl.appendChild(b);});
$('menu').onclick=()=>{if(S.on)flash('E83 · AUDIO',1000);};

// ---------- perillas (girar = arrastrar/rueda · tocar = presionar) ----------
function knob(el,onTurn,onPress){
  let id=null,acc=0,moved=0,last=null,rot=0;
  const turn=d=>{acc+=d;while(Math.abs(acc)>=18){const s=Math.sign(acc);acc-=s*18;rot+=s*15;el.querySelector('.grip').style.setProperty('--r',rot+'deg');onTurn(s);}};
  el.addEventListener('pointerdown',e=>{id=e.pointerId;el.setPointerCapture(id);last={x:e.clientX,y:e.clientY};moved=0;});
  el.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;const dx=e.clientX-last.x,dy=last.y-e.clientY;last={x:e.clientX,y:e.clientY};moved+=Math.abs(dx)+Math.abs(dy);turn(dx+dy);});
  el.addEventListener('pointerup',e=>{if(e.pointerId!==id)return;id=null;if(moved<6){ensureAudio();onPress();}});
  el.addEventListener('pointercancel',()=>id=null);
  el.addEventListener('wheel',e=>{e.preventDefault();turn(-Math.sign(e.deltaY)*18);},{passive:false});
}
knob($('vol'),s=>{if(!S.on)return;S.vol=Math.max(0,Math.min(1,S.vol+s*.05));flash('VOL '+Math.round(S.vol*30),700);},()=>power());
knob($('tune'),s=>stepTune(s),()=>sound());
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')stepTune(1);else if(e.key==='ArrowLeft')stepTune(-1);
  else if(/^[1-9]$/.test(e.key))preset(+e.key-1);else if(e.key===' '){e.preventDefault();power();}
});
requestAnimationFrame(render);
})();
</script>
</body>
</html>
