<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio 950</title>
<style>
  body { margin: 0; padding: 10px; background: #222; font-family: Arial, sans-serif; text-align: center; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .radio { background: #333; border-radius: 8px; padding: 15px; max-width: 200px; box-shadow: 0 3px 10px rgba(0,0,0,0.5); }
  .station { color: #aaa; font-size: 11px; margin-bottom: 8px; }
  .freq { color: #0f0; font-size: 32px; font-weight: bold; margin: 8px 0; font-family: monospace; }
  .status { color: #0f0; font-size: 10px; margin-bottom: 10px; height: 12px; }
  button { width: 100px; padding: 10px; font-size: 14px; background: #0f0; color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
  button:active { opacity: 0.8; }
  .speaker { display: inline-block; margin-top: 10px; }
  .bar { display: inline-block; width: 2px; height: 12px; background: #0f0; margin: 0 1px; vertical-align: middle; }
</style>
</head>
<body>
<div class="radio">
  <div class="station">AM · BUENOS AIRES</div>
  <div class="freq">950</div>
  <div class="status" id="status">apagada</div>
  <button id="btn" onclick="toggle()">ENCENDER</button>
  <div class="speaker">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>
</div>

<audio id="audio" crossorigin="anonymous"></audio>

<script>
var audio = document.getElementById('audio');
var btn = document.getElementById('btn');
var status = document.getElementById('status');
var on = false;

function toggle() {
  if (on) {
    audio.pause();
    audio.src = '';
    on = false;
    btn.textContent = 'ENCENDER';
    status.textContent = 'apagada';
  } else {
    audio.src = 'https://stream.audiostreamhub.com/am950';
    audio.play();
    on = true;
    btn.textContent = 'APAGAR';
    status.textContent = 'conectando...';
  }
}

audio.onplaying = function() { status.textContent = 'en vivo'; };
audio.onwaiting = function() { status.textContent = 'conectando...'; };
audio.onerror = function() { status.textContent = 'sin señal'; };
audio.onended = function() { on = false; btn.textContent = 'ENCENDER'; status.textContent = 'apagada'; };
</script>
</body>
</html>
