<head>

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;font-family:'Rajdhani',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px;background:#f4ede3;color:#2a2a2a}
  svg#radio{width:min(380px,86vw,max(160px,calc((100vh - 280px)*.695652)));height:auto;display:block;touch-action:none}
  @supports(height:100svh){svg#radio{width:min(380px,86vw,max(160px,calc((100svh - 280px)*.695652)))}}
  #capHit,#wheelHit{cursor:ew-resize}
  .bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:520px}
  .chip{border:1px solid #cfcdc7;border-radius:999px;padding:7px 12px;font:500 12px 'Rajdhani',sans-serif;background:#f7f6f3;color:#333;cursor:pointer}
  .chip.on{background:#222;border-color:#222;color:#fff}
  .chip small{opacity:.55;margin-left:4px}
  .status{font-size:12px;letter-spacing:.08em;color:#666;height:16px;text-align:center}
  .hint{font-size:11px;color:#8a8a86;text-align:center;max-width:420px;line-height:1.5}
  #bandRow{position:relative;width:300px;height:78px;margin:4px auto 0;touch-action:none}
  #bandRow:after{content:'';position:absolute;z-index:0;left:50%;top:20px;width:330px;height:330px;margin-left:-166px;border:1px solid rgba(0,0,0,.14);border-radius:50%;pointer-events:none;clip-path:inset(0 0 252px 0)}
  body.dark #bandRow:after{border-color:rgba(255,255,255,.16)}
  #bandRow:before{content:'';position:absolute;left:50%;top:6px;margin-left:-4px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid #9a9a96}
  .bi{position:absolute;top:14px;left:50%;z-index:1;transform-origin:50% 6px;width:52px;margin-left:-26px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;filter:grayscale(0);transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .4s,filter .25s}
  .bi:not(.on){filter:grayscale(.92)}
  .bi i{width:12px;height:12px;background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.05) 42%,rgba(0,0,0,.24)),var(--band-led);border-radius:50%;border:1px solid rgba(32,32,32,.62);box-sizing:border-box;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),inset 0 1px 2px rgba(0,0,0,.38);filter:brightness(.76) saturate(.46);transition:filter .25s,box-shadow .25s,border-color .25s}
  .bi.lit i{filter:brightness(.94) saturate(.8)}
  .bi.led-on i{border-color:rgba(28,28,28,.32);filter:brightness(1.16) saturate(1.08);box-shadow:0 0 4px 1px var(--band-led),0 0 9px 3px var(--band-led),0 0 15px 5px var(--band-led),inset 0 0 0 1px rgba(0,0,0,.12),inset 0 1px 2px rgba(0,0,0,.18)}
  .bi.on:not(.led-on) i{border-color:#686868;background:color-mix(in srgb,var(--band-led) 42%,#fff);filter:none;box-shadow:none}
  .bi span{font:600 12px 'Rajdhani',sans-serif;letter-spacing:.1em;color:#9a9a96}
  .bi.on span{color:#222}body.dark .bi.on span{color:#eee}body.dark .bi:not(.lit) i{filter:brightness(.4) saturate(.72)}
  .bi:not(.on) i{position:relative;z-index:2;background:#d2d2d0;border:1px solid #b8b8b6;box-shadow:none;filter:none}
  body.dark .bi:not(.on) i{background:#c6c6c3;border-color:#a4a4a1;box-shadow:none;filter:none}
  #subdots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));justify-items:center;gap:6px;width:min(360px,90vw);margin:15px auto 0}
  .sd{font-size:10px;letter-spacing:.04em;color:#8a8a86;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
  .sd i{width:8px;height:8px;border-radius:50%;border:1px solid #9a9a96;display:inline-block}
  .sd.on{color:#222;font-weight:600}.sd.on i{background:var(--c);border-color:var(--c)}
  body.dark .sd{color:#888}body.dark .sd.on{color:#eee}
  body.dark{background-color:#030303;background-image:radial-gradient(ellipse at 82% 90%,rgba(148,138,116,.12) 0%,rgba(98,98,92,.08) 27%,transparent 66%),radial-gradient(ellipse at 15% 52%,rgba(255,255,255,.025) 0%,transparent 58%),linear-gradient(165deg,#030303 0%,#080808 22%,#151515 46%,#252524 70%,#353430 100%);background-attachment:fixed;color:#bbb}body.dark .status{color:#888}body.dark .hint{color:#666}
  #stations,#finish,#soundmode{display:none}
  #status,#bandIndicators,#subdots{transition:opacity .4s}
  body.off #status,body.off #bandIndicators,body.off #subdots{opacity:0;pointer-events:none}
    #pwrWrap{position:relative;width:52px;height:52px;display:flex;align-items:center;justify-content:center}
  #status.wtn{color:#8e5bd6}
  #pwr{position:relative;width:52px;height:52px;border:0;border-radius:50%;padding:0;background:#fff;box-shadow:none;cursor:pointer;touch-action:none;overflow:hidden;transition:transform .23s cubic-bezier(.22,.8,.22,1)}
  #pwr:after{content:'';position:absolute;inset:2px;border-radius:50%;box-shadow:inset 0 2px 5px rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .23s,box-shadow .23s ease}
  body:not(.off) #pwr:after{opacity:.9}
  #pwrArtwork{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;pointer-events:none;user-select:none;transition:transform .23s cubic-bezier(.22,.8,.22,1),filter .23s ease}
  body:not(.off) #pwrArtwork{transform:none;filter:brightness(.9) contrast(1.04)}
  #pwr.pressed{transform:translateY(2px) scale(.98);transition-timing-function:cubic-bezier(.32,0,.5,1)}
  #pwr.pressed #pwrArtwork{transform:translateY(3px) scale(.88);filter:brightness(.84) contrast(1.06)}
  body:not(.off) #pwr.pressed #pwrArtwork{transform:translateY(3px) scale(.88);filter:brightness(.76) contrast(1.08)}
  #pwr.pressed:after{opacity:.96;box-shadow:inset 0 3px 6px rgba(0,0,0,.54)}
  #pwrLed{position:absolute;left:calc(100% + 9px);top:50%;width:7px;height:7px;border:1px solid #4d0a07;border-radius:50%;background:radial-gradient(ellipse at 32% 28%,#b95b55 0 10%,#771813 28%,#450906 74%,#280504 100%);transform:translateY(-50%);pointer-events:none;transition:background .25s,border-color .25s,box-shadow .25s}
  body:not(.off) #pwrLed{border-color:#bd130a;background:radial-gradient(ellipse at 32% 28%,#ff806f 0 8%,#ff6152 18%,#f51b0d 45%,#c60000 75%,#760500 100%);box-shadow:0 0 3px 1px rgba(255,20,0,.58),0 0 7px rgba(255,0,0,.76)}
  body.sleep:not(.off) #pwrLed{border-color:#ad65ec;background:radial-gradient(ellipse at 32% 28%,#e5b7ff 0 8%,#dcaaff 18%,#a942e9 45%,#7522bb 75%,#471078 100%);box-shadow:0 0 3px 1px rgba(190,119,255,.72),0 0 8px rgba(143,65,232,.72)}
  #pwr.hold{transform:translateY(2px) scale(.98)}
  #slpMin{position:absolute;z-index:4;left:50%;top:53%;width:40px;height:14px;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);font:700 12px 'Rajdhani',sans-serif;letter-spacing:.06em;color:#48433d;text-shadow:0 1px 0 rgba(255,255,255,.72),0 -1px 1px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none}
  body.sleep #slpMin{opacity:1}
</style>
