// =================== KiwiAM: receptores y YouTube ===================
(function(){
  const RECEIVERS = [
    { name: 'RAMOS MEJIA (LU4EEC)',          host: 'lu4eec.ddns.net',          port: 8073 },
    { name: 'RADIO CLUB ARGENTINO (LU4AA)',  host: 'lu4aa.proxy.kiwisdr.com',  port: null },
    { name: 'MONTEVIDEO (CX8BIT)',           host: 'cx8bit.proxy.kiwisdr.com', port: null },
  ];
  const YT_CHANNELS = ['UCrVXrl6-YV40UD9cNI5nsgA'];
  const OFFICIAL_API = 'https://stream950.com.ar/api/live-stream';
  const base = r => `${r.host}${r.port ? ':' + r.port : ''}`;
  const webLink = (khz, r = RECEIVERS[0]) => `http://${base(r)}/?f=${khz}am`;
  const canConnect = () => location.protocol !== 'https:';

  let ytReady = null;
  function loadYT() {
    if (ytReady) return ytReady;
    ytReady = new Promise(res => {
      if (window.YT && YT.Player) return res(true);
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { prev && prev(); res(true); };
      const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
      s.onerror = () => res(false); document.head.appendChild(s);
      setTimeout(() => res(!!(window.YT && YT.Player)), 8000);
    });
    return ytReady;
  }
  async function officialVideoId() {
    const urls = [OFFICIAL_API,
      'https://api.allorigins.win/raw?url=' + encodeURIComponent(OFFICIAL_API + '?t=' + Date.now()),
      'https://corsproxy.io/?url=' + encodeURIComponent(OFFICIAL_API)];
    for (const u of urls) {
      try {
        const ac = new AbortController(); const t = setTimeout(() => ac.abort(), 5000);
        const r = await fetch(u, { signal: ac.signal, cache: 'no-store' }); clearTimeout(t);
        const j = await r.json(); if (j && j.videoId) return j.videoId;
        if (j && 'videoId' in j) return null;
      } catch (e) {}
    }
    return null;
  }
  function ytPlay(opts, vol) {
    return new Promise(async resolve => {
      if (!(await loadYT())) return resolve(null);
      const host = document.createElement('div');
      host.style.cssText = 'position:fixed;left:0;bottom:0;width:200px;height:113px;opacity:.01;pointer-events:none;z-index:-1';
      const inner = document.createElement('div'); host.appendChild(inner); document.body.appendChild(host);
      let done = false;
      const finish = p => { if (done) return; done = true; clearTimeout(t); if (!p) { try { player.destroy(); } catch (e) {} host.remove(); } resolve(p ? { player, host } : null); };
      const player = new YT.Player(inner, {
        width: 200, height: 113,
        videoId: opts.videoId || 'live_stream',
        playerVars: Object.assign({ autoplay: 1, controls: 0, playsinline: 1, rel: 0 }, opts.channel ? { channel: opts.channel } : {}),
        events: {
          onReady: e => { try { e.target.unMute(); e.target.setVolume(Math.round(vol() * 100)); e.target.playVideo(); } catch (x) {} },
          onStateChange: e => { if (e.data === 1) finish(true); if (e.data === 0) finish(false); },
          onError: () => finish(false),
        },
      });
      const t = setTimeout(() => finish(false), 12000);
    });
  }

  function kiwi(ctx, khz, dest, h, state) {
    let ws = null, idx = 0, keep = null, playAt = 0, rate = 12000, gotAudio = false, timer = null;
    h._closers.push(() => { clearInterval(keep); clearTimeout(timer); try { ws && ws.close(); } catch (e) {} });
    function next() {
      if (h.closed) return;
      if (idx >= RECEIVERS.length) { state('nosig'); return; }
      const r = RECEIVERS[idx++];
      state('tuning'); gotAudio = false;
      try { ws = new WebSocket(`ws://${base(r)}/${Date.now()}/SND`); } catch (e) { next(); return; }
      ws.binaryType = 'arraybuffer';
      const send = m => { try { ws.send(m); } catch (e) {} };
      const setup = () => {
        send(`SET mod=am low_cut=-4900 high_cut=4900 freq=${khz.toFixed(3)}`);
        send('SET agc=1 hang=0 thresh=-100 slope=6 decay=1000 manGain=50');
        send('SET squelch=0 max=0');
        send('SET keepalive');
      };
      clearTimeout(timer);
      timer = setTimeout(() => { if (!gotAudio) { try { ws.close(); } catch (e) {} } }, 10000);
      ws.onopen = () => {
        send('SET auth t=kiwi p=');
        send('SET ident_user=E83-radio');
        send('SET compression=0');
        setup();
        keep = setInterval(() => send('SET keepalive'), 4000);
      };
      ws.onmessage = ev => {
        if (typeof ev.data === 'string') return;
        const u8 = new Uint8Array(ev.data);
        const tag = String.fromCharCode(u8[0], u8[1], u8[2]);
        if (tag === 'MSG') {
          const txt = new TextDecoder().decode(u8.subarray(4));
          const ar = txt.match(/audio_rate=(\d+)/);
          if (ar) { rate = +ar[1]; send(`SET AR OK in=${rate} out=44100`); }
          if (/sample_rate=/.test(txt)) { send('SET compression=0'); setup(); }
          if (/too_busy|badp=1|down|inactivity_timeout/.test(txt)) { try { ws.close(); } catch (e) {} }
          return;
        }
        if (tag !== 'SND') return;
        const dv = new DataView(ev.data, 3);
        if (dv.getUint8(0) & 0x10) return;
        const n = (dv.byteLength - 7) >> 1;
        if (n <= 0) return;
        const buf = ctx.createBuffer(1, n, rate), ch = buf.getChannelData(0);
        for (let i = 0; i < n; i++) ch[i] = dv.getInt16(7 + i * 2, false) / 32768;
        const src = ctx.createBufferSource(); src.buffer = buf; src.connect(dest);
        const now = ctx.currentTime;
        if (playAt < now + 0.05 || playAt > now + 1.5) playAt = now + 0.35;
        src.start(playAt); playAt += buf.duration;
        if (!gotAudio) { gotAudio = true; clearTimeout(timer); h.kind = 'kiwi'; state('ok'); }
      };
      ws.onclose = ws.onerror = () => {
        clearInterval(keep); clearTimeout(timer);
        ws.onclose = ws.onerror = null;
        if (h.closed) return;
        if (gotAudio) { idx = 0; setTimeout(next, 1500); } else next();
      };
    }
    next();
  }

  function open(ctx, khz, dest, cb = {}) {
    let vol = 1, yt = null;
    const h = {
      kind: null, closed: false, _closers: [],
      set volume(v) { vol = v; if (yt) { try { yt.player.setVolume(Math.round(v * 100)); } catch (e) {} } },
      get volume() { return vol; },
      close() { h.closed = true; h._closers.forEach(f => f()); if (yt) { try { yt.player.destroy(); } catch (e) {} yt.host.remove(); yt = null; } },
    };
    const state = s => { if (!h.closed) cb.onState && cb.onState(s, h); };
    (async () => {
      state('tuning');
      if (khz === 950) {
        const vid = await officialVideoId();
        const tries = (vid ? [{ videoId: vid }] : []).concat(YT_CHANNELS.map(channel => ({ channel })));
        for (const t of tries) {
          if (h.closed) return;
          const p = await ytPlay(t, () => vol);
          if (h.closed) { if (p) { try { p.player.destroy(); } catch (e) {} p.host.remove(); } return; }
          if (p) { yt = p; h.kind = 'yt'; state('ok'); return; }
        }
      }
      if (h.closed) return;
      if (canConnect()) kiwi(ctx, khz, dest, h, state); else state('nosig');
    })();
    return h;
  }
  window.KiwiAM = { open, webLink, canConnect, RECEIVERS, _ytPlay: ytPlay };
})();

function initAudio(){
  if(ctx)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
  const len=ctx.sampleRate*2,b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);
  let l=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;l=.97*l+.03*w;d[i]=(w*.35+l*2.2)*(Math.random()<.002?3:1);}

  chainIn.connect(hp).connect(lp).connect(body).connect(sat).connect(comp).connect(fadeG).connect(master);

}

let bodyDown={t:0,x:0,y:0,id:null};
bodyFill.parentElement.addEventListener('pointerdown',e=>{bodyDown={t:performance.now(),x:e.clientX,y:e.clientY,id:e.pointerId};});
svg.addEventListener('pointerup',e=>{if(e.pointerId!==bodyDown.id)return;const moved=Math.abs(e.clientX-bodyDown.x)+Math.abs(e.clientY-bodyDown.y),time=performance.now()-bodyDown.t;
  if(moved<15&&time<200&&e.clientY>200)cycleFinish();bodyDown.id=null;});
addEventListener('keydown',e=>{if(e.key==='p'||e.key==='P'){wake();animWheel(vol>0.02?0:5*STEP);}if(e.key==='ArrowRight')turnCap((e.shiftKey?10:1)/KF);if(e.key==='ArrowLeft')turnCap(-(e.shiftKey?10:1)/KF);
  if(e.key==='ArrowUp')setWheel(wheelA+STEP/2);if(e.key==='ArrowDown')setWheel(wheelA-STEP/2);});
let sweep=null;
function goTo(t){cancelAnimationFrame(sweep);const f0=freq,t0=performance.now(),dur=Math.min(1100,250+Math.abs(t-f0)*2.2);
  const step=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3),nf=f0+(t-f0)*e;turnCap((nf-freq)/KF);if(k<1)sweep=requestAnimationFrame(step);};sweep=requestAnimationFrame(step);}
function nextStation(dir){wake();if(vol<=0.02)animWheel(5*STEP);
  const eps=CAPTURE/2,list=dir>0?STATIONS.filter(s=>s.f>freq+eps):STATIONS.filter(s=>s.f<freq-eps).reverse();
  if(list.length)goTo(list[0].f);}
const FIN={madera:{fill:'#7a4628',grain:1,sh:1},blanco:{fill:'#f1efe9',grain:0,sh:.45},naranja:{fill:'#c9542b',grain:0,sh:.8}};
const finKeys=Object.keys(FIN);let finIdx=0;
function setFinish(k){const o=FIN[k];bodyFill.setAttribute('fill',o.fill);grain.style.display=o.grain?'':'none';bodyShade.setAttribute('opacity',o.sh);finIdx=finKeys.indexOf(k);try{localStorage.setItem('e83-cil',k);}catch(e){}}
function cycleFinish(){finIdx=(finIdx+1)%finKeys.length;setFinish(finKeys[finIdx]);}
let saved='madera';try{saved=localStorage.getItem('e83-cil')||'madera';}catch(e){}setFinish(FIN[saved]?saved:'madera');
function updateBandIndicators(){
  const label=$('bandLabel'),sub=$('subdots');
  label.textContent=EB.name;
  if(window.dialLine)window.dialLine.setAttribute('fill',EB.lineColor);
  sub.innerHTML='';
  if(EB.subs)EB.subs.forEach((x,k)=>{const d=document.createElement('span');d.className='sd'+(k===subIdx?' on':'');d.style.setProperty('--c',EB.lineColor);d.innerHTML='<i></i>'+x.name;d.onclick=e=>{e.stopPropagation();setBand(bandIdx,k);wake();};sub.appendChild(d);});
  generateDial();
}
$('bandIndicators').addEventListener('click',e=>{
  e.stopPropagation();
  setBand((bandIdx+1)%BANDS.length);
  if(bandIdx===0)freq=950;
  wake();
});
const SLEEP=[0,30,60,120];let sleepIdx=0,sleepEnd=0;
function updateZzz(){const z=$('zzz');z.textContent=sleepEnd?'ZZZ '+Math.ceil((sleepEnd-Date.now())/60000)+"'":'ZZZ';z.classList.toggle('on',!!sleepEnd);}
$('zzz').addEventListener('click',e=>{e.stopPropagation();sleepIdx=(sleepIdx+1)%SLEEP.length;sleepEnd=SLEEP[sleepIdx]?Date.now()+SLEEP[sleepIdx]*60000:0;updateZzz();});
setInterval(()=>{if(sleepEnd&&Date.now()>=sleepEnd){sleepEnd=0;sleepIdx=0;if(vol>0.02)animWheel(0);}updateZzz();},1000);
updateBandIndicators();
document.body.addEventListener('click',e=>{if(e.clientX<70&&e.clientY<70)document.body.classList.toggle('dark');});
const pip={v:null,c:null,g:null,img:null};
function drawPip(){const g=pip.g,on=vol>0.02;
  g.fillStyle='#ecebe7';g.fillRect(0,0,320,180);
  if(pip.img.complete&&pip.img.naturalWidth)g.drawImage(pip.img,8,8,164,164);
  g.fillStyle='#222';g.font='600 22px Inter,sans-serif';g.fillText(on&&cur&&cur.st?cur.st.name:'APAGADA',178,84);
  g.fillStyle='#666';g.font='14px Inter,sans-serif';g.fillText(EB.name,178,108);
  g.fillStyle='#222';
  if(on){g.fillRect(190,130,10,28);g.fillRect(210,130,10,28);}
  else{g.beginPath();g.moveTo(190,128);g.lineTo(190,160);g.lineTo(218,144);g.fill();}
  if(on&&pip.v.paused)pip.v.play().catch(()=>{});
  if(!on&&!pip.v.paused)pip.v.pause();}
function setupPip(){
  pip.c=document.createElement('canvas');pip.c.width=320;pip.c.height=180;pip.g=pip.c.getContext('2d');
  pip.img=new Image();pip.img.crossOrigin='anonymous';pip.img.src='radio-icon-192.png';
  pip.v=document.createElement('video');pip.v.muted=true;pip.v.playsInline=true;pip.v.autoPictureInPicture=true;
  pip.v.style.cssText='position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:0;pointer-events:none';
  pip.v.srcObject=pip.c.captureStream(4);document.body.appendChild(pip.v);
  pip.v.onpause=()=>{if(vol>0.02)animWheel(0);};
  pip.v.onplay=()=>{if(vol<=0.02)animWheel(5*STEP);};
  if('mediaSession' in navigator){navigator.mediaSession.setActionHandler('play',()=>animWheel(5*STEP));navigator.mediaSession.setActionHandler('pause',()=>animWheel(0));}
  drawPip();setInterval(drawPip,500);
}
setupPip();
let scY=null,scId=null;
let scDone=false,scWheelT=0;
scale.addEventListener('pointerdown',e=>{scId=e.pointerId;scY=e.clientY;scDone=false;scale.setPointerCapture(scId);});
scale.addEventListener('pointermove',e=>{if(e.pointerId!==scId||scDone)return;const dy=e.clientY-scY;if(Math.abs(dy)>=28){stepStation(dy<0?1:-1);scDone=true;}});
scale.addEventListener('pointerup',()=>scId=null);scale.addEventListener('pointercancel',()=>scId=null);
scale.addEventListener('wheel',e=>{e.preventDefault();const t=performance.now();if(t-scWheelT<250)return;scWheelT=t;stepStation(Math.sign(e.deltaY));},{passive:false});
requestAnimationFrame(loop);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('radio-sw.js').catch(()=>{});
})();
</script>
